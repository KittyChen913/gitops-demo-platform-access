name: "Configure AWS Credentials"
description: "Configure short-lived AWS credentials through GitHub OIDC."

inputs:
  aws-account-id:
    description: "AWS account ID used to compose the runtime OIDC role ARN."
    required: true

runs:
  using: "composite"
  steps:
    - name: "Resolve AWS OIDC role"
      id: resolve
      shell: bash
      env:
        AWS_ACCOUNT_ID: ${{ inputs.aws-account-id }}
      run: |
        set -euo pipefail
        config="${GITHUB_WORKSPACE}/config/shared.json"
        aws_region="$(jq -r '.aws.region' "${config}")"
        role_name="$(jq -r '.aws.oidc_role_name' "${config}")"
        role_arn="arn:aws:iam::${AWS_ACCOUNT_ID}:role/${role_name}"
        echo "::add-mask::${role_arn}"
        if [[ ! "${role_arn}" =~ ^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$ ]]; then
          echo "::error::Runtime AWS role ARN is missing or invalid."
          exit 1
        fi
        printf 'aws_region=%s\n' "${aws_region}" >> "${GITHUB_OUTPUT}"
        printf 'role_arn=%s\n' "${role_arn}" >> "${GITHUB_OUTPUT}"

    - name: "Configure AWS credentials via OIDC"
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ steps.resolve.outputs.role_arn }}
        role-session-name: openvpn-dns-${{ github.run_id }}
        aws-region: ${{ steps.resolve.outputs.aws_region }}
        mask-aws-account-id: true
        unset-current-credentials: true
