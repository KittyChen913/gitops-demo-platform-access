name: "Deployment"

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: "openvpn-dns-mutation"
  cancel-in-progress: false

jobs:
  validate-deployment-tag:
    name: "Validate"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Checkout complete history"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Validate Tag contract and master ancestry"
        run: |
          set -euo pipefail
          config="config/shared.json"
          tag_prefix="$(jq -r '.repository.deployment_tag_prefix' "${config}")"
          operations_ref="$(jq -r '.repository.operations_ref' "${config}")"
          expected_ref_prefix="refs/tags/${tag_prefix}"

          test "${GITHUB_REPOSITORY}" = "$(jq -r '.repository.slug' "${config}")"
          [[ "${GITHUB_REF}" == "${expected_ref_prefix}"* ]]
          version="${GITHUB_REF#"${expected_ref_prefix}"}"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          operations_branch="${operations_ref#refs/heads/}"
          remote_operations_ref="refs/remotes/origin/${operations_branch}"
          git show-ref --verify --quiet "${remote_operations_ref}"
          git merge-base --is-ancestor "${GITHUB_SHA}" "${remote_operations_ref}"
          printf 'Approved deployment Tag: %s\n' "${GITHUB_REF}"

  static-validation:
    name: "Terraform Validate [${{ matrix.root }}]"
    needs: validate-deployment-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        root:
          - terraform/environments/shared/credential-bootstrap
          - terraform/environments/shared/base
    defaults:
      run:
        working-directory: ${{ matrix.root }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.13.5"

      - name: "Terraform init without backend"
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: "Terraform format check"
        run: terraform fmt -check -recursive -diff

      - name: "Terraform validate"
        run: terraform validate -no-color

  ensure-state-backend:
    name: "Ensure Terraform state backend"
    needs: static-validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Configure AWS credentials via OIDC"
        uses: ./.github/actions/configure-aws-credentials
        with:
          aws-account-id: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: "Ensure Terraform state bucket"
        run: bash scripts/ensure-tfstate-bucket.sh

  credential-bootstrap:
    name: "Deploy credential-bootstrap"
    needs: ensure-state-backend
    uses: ./.github/workflows/terraform-apply-stage.yml
    with:
      deployment: credential-bootstrap
    secrets: inherit

  base:
    name: "Deploy BASE"
    needs: credential-bootstrap
    uses: ./.github/workflows/terraform-apply-stage.yml
    with:
      deployment: base
    secrets: inherit

  reconcile-bootstrap-http:
    name: "Reconcile OpenVPN bootstrap HTTP"
    needs: base
    if: always() && needs.base.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.13.5"

      - name: "Configure AWS credentials via OIDC"
        uses: ./.github/actions/configure-aws-credentials
        with:
          aws-account-id: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: "Terraform init"
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/openvpn-dns-base-bootstrap-http"
          mkdir -p "${work}"
          backend_file="${work}/base-backend.hcl"
          root="$(bash scripts/resolve-terraform-backend.sh base "${backend_file}")"
          terraform -chdir="${root}" init -input=false -lockfile=readonly -backend-config="${backend_file}"

          {
            printf 'TF_ROOT=%s\n' "${root}"
            printf 'CLEANUP_WORK=%s\n' "${work}"
          } >> "${GITHUB_ENV}"

      - name: "Close OpenVPN bootstrap HTTP"
        run: |
          set -euo pipefail
          config="${GITHUB_WORKSPACE}/config/shared.json"
          linode_path="$(jq -r '.aws.ssm_parameter_paths.linode_token' "${config}")"
          contact_path="$(jq -r '.aws.ssm_parameter_paths.openvpn_contact_email' "${config}")"
          public_key_path="$(jq -r '.aws.ssm_parameter_paths.openvpn_ssh_public_key' "${config}")"
          linode_token="$(aws ssm get-parameter --name "${linode_path}" --with-decryption --query Parameter.Value --output text)"
          contact_email="$(aws ssm get-parameter --name "${contact_path}" --with-decryption --query Parameter.Value --output text)"
          ssh_public_key="$(aws ssm get-parameter --name "${public_key_path}" --query Parameter.Value --output text)"
          echo "::add-mask::${linode_token}"
          echo "::add-mask::${contact_email}"

          close_plan="${CLEANUP_WORK}/openvpn-bootstrap-close.tfplan"
          close_json="${CLEANUP_WORK}/openvpn-bootstrap-close.json"
          LINODE_TOKEN="${linode_token}" \
            TF_VAR_openvpn_contact_email="${contact_email}" \
            TF_VAR_ansible_ssh_public_key="${ssh_public_key}" \
            terraform -chdir="${TF_ROOT}" plan -input=false -refresh=true -lock=false \
              -target='module.openvpn.linode_firewall.openvpn' -out="${close_plan}"
          terraform -chdir="${TF_ROOT}" show -json "${close_plan}" > "${close_json}"
          bash scripts/verify-plan-policy.sh "${close_json}" base bootstrap-close
          LINODE_TOKEN="${linode_token}" terraform -chdir="${TF_ROOT}" apply -input=false "${close_plan}"

      - name: "Remove bootstrap HTTP cleanup bundle"
        if: always()
        run: rm -rf "${RUNNER_TEMP}/openvpn-dns-base-bootstrap-http"

  configure-base:
    name: "Configure BASE"
    needs: reconcile-bootstrap-http
    uses: ./.github/workflows/base-configuration.yml
    secrets: inherit
