name: "OpenVPN/DNS reusable deployment stage"

on:
  workflow_call:
    inputs:
      deployment:
        description: "Terraform root"
        required: true
        type: string
    secrets:
      AWS_ACCOUNT_ID:
        required: true

permissions:
  contents: read

jobs:
  plan:
    name: "Plan [${{ inputs.deployment }}]"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      plan_sha256: ${{ steps.verify_plan.outputs.plan_sha256 }}
      bootstrap_needed: ${{ steps.create_plan.outputs.bootstrap_needed }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.13.5"

      - name: "Validate deployment input"
        env:
          DEPLOYMENT: ${{ inputs.deployment }}
        run: |
          set -euo pipefail
          case "${DEPLOYMENT}" in credential-bootstrap|base) ;; *) exit 1 ;; esac

      - name: "Configure AWS credentials via OIDC"
        uses: ./.github/actions/configure-aws-credentials
        with:
          aws-account-id: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: "Terraform init"
        env:
          DEPLOYMENT: ${{ inputs.deployment }}
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/openvpn-dns-${DEPLOYMENT}-apply-plan"
          work="${RUNNER_TEMP}/openvpn-dns-${DEPLOYMENT}-plan-work"
          mkdir -p "${bundle}" "${work}"
          backend_file="${work}/${DEPLOYMENT}-backend.hcl"
          root="$(bash scripts/resolve-terraform-backend.sh "${DEPLOYMENT}" "${backend_file}")"
          terraform -chdir="${root}" init -input=false -lockfile=readonly -backend-config="${backend_file}"

          {
            printf 'TF_ROOT=%s\n' "${root}"
            printf 'PLAN_WORK=%s\n' "${work}"
            printf 'PLAN_FILE=%s\n' "${bundle}/terraform.tfplan"
          } >> "${GITHUB_ENV}"

      - name: "Create Terraform plan"
        id: create_plan
        env:
          DEPLOYMENT: ${{ inputs.deployment }}
        run: |
          set -euo pipefail
          config="${GITHUB_WORKSPACE}/config/shared.json"

          if [[ "${DEPLOYMENT}" == "base" ]]; then
            linode_path="$(jq -r '.aws.ssm_parameter_paths.linode_token' "${config}")"
            contact_path="$(jq -r '.aws.ssm_parameter_paths.openvpn_contact_email' "${config}")"
            public_key_path="$(jq -r '.aws.ssm_parameter_paths.openvpn_ssh_public_key' "${config}")"
            linode_token="$(aws ssm get-parameter --name "${linode_path}" --with-decryption --query Parameter.Value --output text)"
            contact_email="$(aws ssm get-parameter --name "${contact_path}" --with-decryption --query Parameter.Value --output text)"
            ssh_public_key="$(aws ssm get-parameter --name "${public_key_path}" --query Parameter.Value --output text)"
            echo "::add-mask::${linode_token}"
            echo "::add-mask::${contact_email}"

            detect_plan="${RUNNER_TEMP}/openvpn-bootstrap-detect.tfplan"
            detect_json="${RUNNER_TEMP}/openvpn-bootstrap-detect.json"
            trap 'rm -f "${detect_plan}" "${detect_json}"' EXIT
            LINODE_TOKEN="${linode_token}" \
              TF_VAR_openvpn_contact_email="${contact_email}" \
              TF_VAR_ansible_ssh_public_key="${ssh_public_key}" \
              terraform -chdir="${TF_ROOT}" plan -input=false -refresh=true -lock=false \
                -target='module.openvpn.linode_instance.openvpn' -out="${detect_plan}"
            terraform -chdir="${TF_ROOT}" show -json "${detect_plan}" > "${detect_json}"
            bootstrap_needed="$(bash scripts/resolve-openvpn-bootstrap-need.sh "${detect_json}")"
            printf 'bootstrap_needed=%s\n' "${bootstrap_needed}" >> "${GITHUB_OUTPUT}"

            LINODE_TOKEN="${linode_token}" \
              TF_VAR_openvpn_contact_email="${contact_email}" \
              TF_VAR_ansible_ssh_public_key="${ssh_public_key}" \
              TF_VAR_openvpn_bootstrap_http_enabled="${bootstrap_needed}" \
              terraform -chdir="${TF_ROOT}" plan -input=false -refresh=true -lock=false -out="${PLAN_FILE}"
          else
            printf 'bootstrap_needed=false\n' >> "${GITHUB_OUTPUT}"
            terraform -chdir="${TF_ROOT}" plan -input=false -refresh=true -lock=false -out="${PLAN_FILE}"
          fi

      - name: "Verify plan policy"
        id: verify_plan
        env:
          DEPLOYMENT: ${{ inputs.deployment }}
        run: |
          set -euo pipefail
          plan_json="${PLAN_WORK}/${DEPLOYMENT}.tfplan.json"
          terraform -chdir="${TF_ROOT}" show -json "${PLAN_FILE}" > "${plan_json}"
          bash scripts/verify-plan-policy.sh "${plan_json}" "${DEPLOYMENT}" apply
          plan_sha256="$(sha256sum "${PLAN_FILE}" | awk '{print $1}')"
          [[ "${plan_sha256}" =~ ^[0-9a-f]{64}$ ]]
          printf 'plan_sha256=%s\n' "${plan_sha256}" >> "${GITHUB_OUTPUT}"
          rm -f "${plan_json}" "${PLAN_WORK}/${DEPLOYMENT}-backend.hcl"

      - name: "Upload minimal saved-plan artifact"
        uses: actions/upload-artifact@v7
        with:
          name: openvpn-dns-${{ inputs.deployment }}-apply-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openvpn-dns-${{ inputs.deployment }}-apply-plan/terraform.tfplan
          if-no-files-found: error
          retention-days: 1

      - name: "Remove runner plan bundle"
        if: always()
        run: |
          rm -rf \
            "${RUNNER_TEMP}/openvpn-dns-${{ inputs.deployment }}-apply-plan" \
            "${RUNNER_TEMP}/openvpn-dns-${{ inputs.deployment }}-plan-work"

  apply-tagged-plan:
    name: "Apply [${{ inputs.deployment }}]"
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.13.5"

      - name: "Download this run's saved plan"
        uses: actions/download-artifact@v8
        with:
          name: openvpn-dns-${{ inputs.deployment }}-apply-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openvpn-dns-${{ inputs.deployment }}-apply-plan

      - name: "Verify saved plan checksum before credentials"
        env:
          DEPLOYMENT: ${{ inputs.deployment }}
          EXPECTED_PLAN_SHA256: ${{ needs.plan.outputs.plan_sha256 }}
        run: |
          set -euo pipefail
          plan_file="${RUNNER_TEMP}/openvpn-dns-${DEPLOYMENT}-apply-plan/terraform.tfplan"
          test -f "${plan_file}"
          test ! -L "${plan_file}"
          [[ "${EXPECTED_PLAN_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          actual_plan_sha256="$(sha256sum "${plan_file}" | awk '{print $1}')"
          test "${actual_plan_sha256}" = "${EXPECTED_PLAN_SHA256}"

      - name: "Configure AWS credentials via OIDC"
        uses: ./.github/actions/configure-aws-credentials
        with:
          aws-account-id: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: "Terraform init"
        env:
          DEPLOYMENT: ${{ inputs.deployment }}
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/openvpn-dns-${DEPLOYMENT}-apply-plan"
          work="${RUNNER_TEMP}/openvpn-dns-${DEPLOYMENT}-apply-work"
          mkdir -p "${work}"
          backend_file="${work}/${DEPLOYMENT}-backend.hcl"
          root="$(bash scripts/resolve-terraform-backend.sh "${DEPLOYMENT}" "${backend_file}")"
          terraform -chdir="${root}" init -input=false -lockfile=readonly -backend-config="${backend_file}"

          {
            printf 'TF_ROOT=%s\n' "${root}"
            printf 'APPLY_WORK=%s\n' "${work}"
            printf 'PLAN_FILE=%s\n' "${bundle}/terraform.tfplan"
          } >> "${GITHUB_ENV}"

      - name: "Verify required SSM parameters exist"
        if: inputs.deployment == 'base'
        run: |
          set -euo pipefail
          config="${GITHUB_WORKSPACE}/config/shared.json"
          for required_path in \
            "$(jq -r '.aws.ssm_parameter_paths.openvpn_admin_password' "${config}")" \
            "$(jq -r '.aws.ssm_parameter_paths.openvpn_ssh_private_key_b64' "${config}")" \
            "$(jq -r '.aws.ssm_parameter_paths.openvpn_ssh_public_key' "${config}")"; do
            aws ssm get-parameter --name "${required_path}" --query Parameter.Name --output text >/dev/null
          done
          while IFS= read -r required_path; do
            aws ssm get-parameter --name "${required_path}" --query Parameter.Name --output text >/dev/null
          done < <(jq -r '.identities[].password_ssm_path' config/automation-identities.json)

      - name: "Terraform apply"
        env:
          DEPLOYMENT: ${{ inputs.deployment }}
        run: |
          set -euo pipefail
          config="${GITHUB_WORKSPACE}/config/shared.json"

          if [[ "${DEPLOYMENT}" == "base" ]]; then
            linode_path="$(jq -r '.aws.ssm_parameter_paths.linode_token' "${config}")"
            linode_token="$(aws ssm get-parameter --name "${linode_path}" --with-decryption --query Parameter.Value --output text)"
            echo "::add-mask::${linode_token}"
            LINODE_TOKEN="${linode_token}" terraform -chdir="${TF_ROOT}" apply -input=false "${PLAN_FILE}"
          else
            terraform -chdir="${TF_ROOT}" apply -input=false "${PLAN_FILE}"
          fi

      - name: "Read BASE outputs for bootstrap readiness"
        id: bootstrap_outputs
        if: inputs.deployment == 'base' && needs.plan.outputs.bootstrap_needed == 'true'
        run: |
          set -euo pipefail
          {
            printf 'instance_id=%s\n' "$(terraform -chdir="${TF_ROOT}" output -raw openvpn_instance_id)"
            printf 'firewall_id=%s\n' "$(terraform -chdir="${TF_ROOT}" output -raw openvpn_firewall_id)"
            printf 'reserved_ip=%s\n' "$(terraform -chdir="${TF_ROOT}" output -raw openvpn_reserved_ipv4)"
            printf 'admin_port=%s\n' "$(jq -r '.linode.admin_port' config/shared.json)"
          } >> "${GITHUB_OUTPUT}"

      - name: "Open BASE access for bootstrap readiness"
        id: open_bootstrap
        if: inputs.deployment == 'base' && needs.plan.outputs.bootstrap_needed == 'true'
        uses: ./.github/actions/open-base-access
        with:
          instance-id: ${{ steps.bootstrap_outputs.outputs.instance_id }}
          firewall-id: ${{ steps.bootstrap_outputs.outputs.firewall_id }}
          reserved-ip: ${{ steps.bootstrap_outputs.outputs.reserved_ip }}
          admin-port: ${{ steps.bootstrap_outputs.outputs.admin_port }}
          aws-account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          fetch-admin-password: "true"
          prepare-ansible: "true"

      - name: "Wait for OpenVPN Marketplace readiness"
        if: inputs.deployment == 'base' && needs.plan.outputs.bootstrap_needed == 'true'
        env:
          RESERVED_IP: ${{ steps.bootstrap_outputs.outputs.reserved_ip }}
          WORK_DIR: ${{ steps.open_bootstrap.outputs.work-dir }}
        run: |
          set -euo pipefail
          ssh_user="$(jq -r '.linode.automation_username' config/shared.json)"
          credentials_path="/home/${ssh_user}/.credentials"
          bash scripts/wait-for-openvpn-marketplace-readiness.sh \
            "${RESERVED_IP}" "${ssh_user}" "${WORK_DIR}/id_ed25519" "${WORK_DIR}/known_hosts" "${credentials_path}"

      - name: "Enforce OpenVPN admin identity before first Configure run"
        if: inputs.deployment == 'base' && needs.plan.outputs.bootstrap_needed == 'true'
        env:
          INVENTORY: ${{ steps.open_bootstrap.outputs.inventory-path }}
        run: |
          set -euo pipefail
          ANSIBLE_CONFIG="${GITHUB_WORKSPACE}/ansible/ansible.cfg" \
            ansible-playbook -i "${INVENTORY}" ansible/playbooks/configure-openvpn-server.yml --tags admin-identity

      - name: "Apply OpenVPN admin password before first Configure run"
        if: inputs.deployment == 'base' && needs.plan.outputs.bootstrap_needed == 'true'
        env:
          INVENTORY: ${{ steps.open_bootstrap.outputs.inventory-path }}
          WORK_DIR: ${{ steps.open_bootstrap.outputs.work-dir }}
        run: |
          set -euo pipefail
          OPENVPN_ADMIN_PASSWORD="$(cat "${WORK_DIR}/admin_password")" ANSIBLE_CONFIG="${GITHUB_WORKSPACE}/ansible/ansible.cfg" \
            ansible-playbook -i "${INVENTORY}" ansible/playbooks/reset-openvpn-admin-password.yml --tags set-password

      - name: "Verify OpenVPN admin/client login before first Configure run"
        if: inputs.deployment == 'base' && needs.plan.outputs.bootstrap_needed == 'true'
        env:
          INVENTORY: ${{ steps.open_bootstrap.outputs.inventory-path }}
          WORK_DIR: ${{ steps.open_bootstrap.outputs.work-dir }}
        run: |
          set -euo pipefail
          OPENVPN_ADMIN_PASSWORD="$(cat "${WORK_DIR}/admin_password")" ANSIBLE_CONFIG="${GITHUB_WORKSPACE}/ansible/ansible.cfg" \
            ansible-playbook -i "${INVENTORY}" ansible/playbooks/reset-openvpn-admin-password.yml --tags verify-login

      - name: "Close BASE access after bootstrap readiness"
        if: always() && inputs.deployment == 'base' && needs.plan.outputs.bootstrap_needed == 'true'
        uses: ./.github/actions/close-base-access
        with:
          firewall-id: ${{ steps.bootstrap_outputs.outputs.firewall_id }}
          instance-id: ${{ steps.bootstrap_outputs.outputs.instance_id }}
          work-dir: ${{ steps.open_bootstrap.outputs.work-dir }}
          runner-cidr: ${{ steps.open_bootstrap.outputs.runner-cidr }}

      - name: "Remove runner apply bundle"
        if: always()
        run: |
          rm -rf \
            "${RUNNER_TEMP}/openvpn-dns-${{ inputs.deployment }}-apply-plan" \
            "${RUNNER_TEMP}/openvpn-dns-${{ inputs.deployment }}-apply-work"
