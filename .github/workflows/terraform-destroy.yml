name: "Terraform Destroy"

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DESTROY-SHARED-ALL to confirm"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: "openvpn-dns-mutation"
  cancel-in-progress: false

jobs:
  plan:
    name: "Plan Destroy"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      base_plan_sha256: ${{ steps.create_plans.outputs.base_plan_sha256 }}
      credential_plan_sha256: ${{ steps.create_plans.outputs.credential_bootstrap_plan_sha256 }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.5

      - name: "Validate destroy boundary"
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          GIT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "${GIT_REF}" = "$(jq -r '.repository.operations_ref' config/shared.json)"
          test "${CONFIRMATION}" = "DESTROY-SHARED-ALL"

      - name: "Configure AWS plan credentials via OIDC"
        uses: ./.github/actions/configure-aws-credentials
        with:
          aws-account-id: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: "Create and verify destroy plans"
        id: create_plans
        run: |
          set -euo pipefail
          config="${GITHUB_WORKSPACE}/config/shared.json"
          bundle="${RUNNER_TEMP}/openvpn-dns-destroy-plans"
          work="${RUNNER_TEMP}/openvpn-dns-destroy-work"
          trap 'unset linode_token contact_email ssh_public_key 2>/dev/null || true; rm -rf "${bundle}" "${work}"' EXIT
          mkdir -p "${bundle}" "${work}"
          umask 077

          create_destroy_plan() {
            local deployment="$1"
            local root
            local deployment_bundle="${bundle}/${deployment}"
            local backend_file="${work}/${deployment}-backend.hcl"
            local plan_file="${deployment_bundle}/terraform.tfplan"
            local plan_json="${work}/${deployment}.tfplan.json"
            local plan_sha256
            mkdir -p "${deployment_bundle}"
            root="$(bash scripts/resolve-terraform-backend.sh "${deployment}" "${backend_file}")"
            terraform -chdir="${root}" init -input=false -lockfile=readonly -backend-config="${backend_file}"

            if [[ "${deployment}" == "base" ]]; then
              linode_path="$(jq -r '.aws.ssm_parameter_paths.linode_token' "${config}")"
              contact_path="$(jq -r '.aws.ssm_parameter_paths.openvpn_contact_email' "${config}")"
              public_key_path="$(jq -r '.aws.ssm_parameter_paths.openvpn_ssh_public_key' "${config}")"
              linode_token="$(aws ssm get-parameter --name "${linode_path}" --with-decryption --query Parameter.Value --output text)"
              contact_email="$(aws ssm get-parameter --name "${contact_path}" --with-decryption --query Parameter.Value --output text)"
              ssh_public_key="$(aws ssm get-parameter --name "${public_key_path}" --query Parameter.Value --output text)"
              echo "::add-mask::${linode_token}"
              echo "::add-mask::${contact_email}"
              LINODE_TOKEN="${linode_token}" TF_VAR_openvpn_contact_email="${contact_email}" TF_VAR_ansible_ssh_public_key="${ssh_public_key}" \
                terraform -chdir="${root}" plan -destroy -input=false -refresh=true -lock=false -out="${plan_file}"
              unset linode_token contact_email ssh_public_key
            else
              terraform -chdir="${root}" plan -destroy -input=false -refresh=true -lock=false -out="${plan_file}"
            fi

            terraform -chdir="${root}" show -json "${plan_file}" > "${plan_json}"
            bash scripts/verify-plan-policy.sh "${plan_json}" "${deployment}" destroy
            plan_sha256="$(sha256sum "${plan_file}" | awk '{print $1}')"
            [[ "${plan_sha256}" =~ ^[0-9a-f]{64}$ ]]
            printf '%s_plan_sha256=%s\n' "${deployment//-/_}" "${plan_sha256}" >> "${GITHUB_OUTPUT}"
            rm -f "${backend_file}" "${plan_json}"
          }

          create_destroy_plan base
          create_destroy_plan credential-bootstrap

          trap - EXIT
          unset linode_token contact_email ssh_public_key 2>/dev/null || true
          rm -rf "${work}"

      - name: "Upload this run's destroy plans"
        uses: actions/upload-artifact@v7
        with:
          name: openvpn-dns-destroy-plans-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openvpn-dns-destroy-plans/
          if-no-files-found: error
          retention-days: 1

      - name: "Remove runner plan bundle"
        if: always()
        run: rm -rf "${RUNNER_TEMP}/openvpn-dns-destroy-plans"

  destroy:
    name: "Destroy"
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.5

      - name: "Download this run's destroy plans"
        uses: actions/download-artifact@v8
        with:
          name: openvpn-dns-destroy-plans-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openvpn-dns-destroy-plans

      - name: "Verify saved plan checksums before credentials"
        env:
          BASE_PLAN_SHA256: ${{ needs.plan.outputs.base_plan_sha256 }}
          CREDENTIAL_PLAN_SHA256: ${{ needs.plan.outputs.credential_plan_sha256 }}
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/openvpn-dns-destroy-plans"
          verify_bundle() {
            local deployment="$1"
            local expected_sha256="$2"
            local deployment_bundle="${bundle}/${deployment}"
            local plan_file="${deployment_bundle}/terraform.tfplan"
            local actual_sha256
            test -f "${plan_file}"
            test ! -L "${plan_file}"
            [[ "${expected_sha256}" =~ ^[0-9a-f]{64}$ ]]
            actual_sha256="$(sha256sum "${plan_file}" | awk '{print $1}')"
            test "${actual_sha256}" = "${expected_sha256}"
          }
          verify_bundle base "${BASE_PLAN_SHA256}"
          verify_bundle credential-bootstrap "${CREDENTIAL_PLAN_SHA256}"

      - name: "Configure AWS destroy credentials via OIDC"
        uses: ./.github/actions/configure-aws-credentials
        with:
          aws-account-id: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: "Apply verified destroy plans in dependency order"
        run: |
          set -euo pipefail
          config="${GITHUB_WORKSPACE}/config/shared.json"
          bundle="${RUNNER_TEMP}/openvpn-dns-destroy-plans"
          work="${RUNNER_TEMP}/openvpn-dns-destroy-work"
          trap 'unset linode_token 2>/dev/null || true; rm -rf "${bundle}" "${work}"' EXIT
          mkdir -p "${work}"
          umask 077

          prepare_destroy_plan() {
            local deployment="$1"
            local backend_file="${work}/${deployment}-backend.hcl"
            local root
            root="$(bash scripts/resolve-terraform-backend.sh "${deployment}" "${backend_file}")"
            terraform -chdir="${root}" init -input=false -lockfile=readonly -backend-config="${backend_file}" >&2
            printf '%s' "${root}"
          }

          base_root="$(prepare_destroy_plan base)"
          linode_path="$(jq -r '.aws.ssm_parameter_paths.linode_token' "${config}")"
          linode_token="$(aws ssm get-parameter --name "${linode_path}" --with-decryption --query Parameter.Value --output text)"
          echo "::add-mask::${linode_token}"
          LINODE_TOKEN="${linode_token}" terraform -chdir="${base_root}" apply -input=false "${bundle}/base/terraform.tfplan"
          unset linode_token

          if [[ -n "$(terraform -chdir="${base_root}" state list)" ]]; then
            echo "BASE state is not empty after applying its destroy plan; credentials will not be destroyed." >&2
            exit 1
          fi

          runtime_cleanup_error="${work}/runtime-parameter-cleanup.error"
          mapfile -t runtime_parameter_paths < <(
            {
              jq -r '.aws.ssm_parameter_paths.openvpn_ssh_host_key' "${config}"
              jq -r '.identities[].profile_ssm_path' config/automation-identities.json
            } | sort -u
          )
          for runtime_parameter_path in "${runtime_parameter_paths[@]}"; do
            [[ "${runtime_parameter_path}" == /gitops/openvpn-dns/* ]]
            if aws ssm get-parameter \
              --name "${runtime_parameter_path}" \
              --query Parameter.Name \
              --output text >/dev/null 2>"${runtime_cleanup_error}"; then
              aws ssm delete-parameter --name "${runtime_parameter_path}" >/dev/null
            elif ! grep -q 'ParameterNotFound' "${runtime_cleanup_error}"; then
              echo "Unable to verify or remove a retired OpenVPN runtime parameter." >&2
              exit 1
            fi
            rm -f "${runtime_cleanup_error}"
          done

          break_glass_parameter_path="$(
            jq -r '.aws.ssm_parameter_paths.vpnadmin_sudo_password' "${config}"
          )"
          test "${break_glass_parameter_path}" = \
            "/gitops/openvpn-dns/openvpn/break-glass/VPNADMIN_SUDO_PASSWORD"
          if ! aws ssm delete-parameter \
            --name "${break_glass_parameter_path}" \
            >/dev/null 2>"${runtime_cleanup_error}" &&
            ! grep -q 'ParameterNotFound' "${runtime_cleanup_error}"; then
            echo "Unable to remove the retired VPN administrator credential." >&2
            echo "BASE infrastructure is already destroyed and credential-bootstrap was left intact." >&2
            echo "Grant ssm:DeleteParameter on the break-glass parameter, then re-run this workflow." >&2
            exit 1
          fi
          rm -f "${runtime_cleanup_error}"

          credential_root="$(prepare_destroy_plan credential-bootstrap)"
          terraform -chdir="${credential_root}" apply -input=false "${bundle}/credential-bootstrap/terraform.tfplan"
