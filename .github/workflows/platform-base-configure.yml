name: "Platform Access reusable BASE configuration"

on:
  workflow_call:
    secrets:
      AWS_ACCOUNT_ID:
        required: true

permissions:
  contents: read

jobs:
  resolve-base:
    name: "Resolve BASE infrastructure"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TERRAFORM_ROOT: terraform/environments/shared/base
    outputs:
      instance_id: ${{ steps.outputs.outputs.instance_id }}
      firewall_id: ${{ steps.outputs.outputs.firewall_id }}
      reserved_ip: ${{ steps.outputs.outputs.reserved_ip }}
      admin_port: ${{ steps.outputs.outputs.admin_port }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.5

      - name: "Prepare AWS OIDC inputs"
        id: aws_oidc_inputs
        run: |
          set -euo pipefail
          aws_region="$(jq -r '.aws.region' config/shared.json)"
          role_name="$(jq -r '.aws.oidc_role_name' config/shared.json)"
          printf 'aws_region=%s\n' "${aws_region}" >> "${GITHUB_OUTPUT}"
          printf 'role_name=%s\n' "${role_name}" >> "${GITHUB_OUTPUT}"

      - name: "Configure AWS credentials via OIDC"
        uses: ./.github/actions/configure-aws-credentials
        with:
          aws-region: ${{ steps.aws_oidc_inputs.outputs.aws_region }}
          role-arn: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ steps.aws_oidc_inputs.outputs.role_name }}

      - name: "Terraform init"
        run: |
          set -euo pipefail
          backend="${RUNNER_TEMP}/backend.hcl"
          jq -r --arg region "${AWS_REGION}" '.terraform_backend | "bucket = \"\(.bucket)\"\nkey = \"\(.key)\"\nregion = \"\($region)\"\nencrypt = \"\(.encrypt)\"\nuse_lockfile = \"\(.use_lockfile)\""' config/shared.json > "${backend}"
          terraform -chdir="${TERRAFORM_ROOT}" init -input=false -lockfile=readonly -backend-config="${backend}"

      - name: "Read BASE outputs"
        id: outputs
        run: |
          set -euo pipefail
          {
            printf 'instance_id=%s\n' "$(terraform -chdir="${TERRAFORM_ROOT}" output -raw openvpn_instance_id)"
            printf 'firewall_id=%s\n' "$(terraform -chdir="${TERRAFORM_ROOT}" output -raw openvpn_firewall_id)"
            printf 'reserved_ip=%s\n' "$(terraform -chdir="${TERRAFORM_ROOT}" output -raw openvpn_reserved_ipv4)"
            printf 'admin_port=%s\n' "$(jq -r '.linode.admin_port' config/shared.json)"
          } >> "${GITHUB_OUTPUT}"

  configure-base:
    name: "Configure and verify BASE"
    needs: resolve-base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      INSTANCE_ID: ${{ needs.resolve-base.outputs.instance_id }}
      FIREWALL_ID: ${{ needs.resolve-base.outputs.firewall_id }}
      RESERVED_IP: ${{ needs.resolve-base.outputs.reserved_ip }}
      ADMIN_PORT: ${{ needs.resolve-base.outputs.admin_port }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Prepare AWS OIDC inputs"
        id: aws_oidc_inputs
        run: |
          set -euo pipefail
          aws_region="$(jq -r '.aws.region' config/shared.json)"
          role_name="$(jq -r '.aws.oidc_role_name' config/shared.json)"
          printf 'aws_region=%s\n' "${aws_region}" >> "${GITHUB_OUTPUT}"
          printf 'role_name=%s\n' "${role_name}" >> "${GITHUB_OUTPUT}"

      - name: "Configure AWS credentials via OIDC"
        uses: ./.github/actions/configure-aws-credentials
        with:
          aws-region: ${{ steps.aws_oidc_inputs.outputs.aws_region }}
          role-arn: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ steps.aws_oidc_inputs.outputs.role_name }}

      - name: "Install pinned Ansible runtime"
        run: pipx install ansible-core==2.17.7

      - name: "Prepare working directory"
        run: |
          set -euo pipefail
          umask 077
          echo "WORK_DIR=${RUNNER_TEMP}/platform-access-configure" >> "${GITHUB_ENV}"
          mkdir -p "${RUNNER_TEMP}/platform-access-configure"
          chmod 700 "${RUNNER_TEMP}/platform-access-configure"

      - name: "Discover runner public IPv4"
        id: runner_ip
        run: |
          set -euo pipefail
          runner_ip="$(bash scripts/discover-runner-public-ip.sh)"
          printf 'runner_cidr=%s/32\n' "${runner_ip}" >> "${GITHUB_OUTPUT}"

      - name: "Fetch secrets from SSM"
        run: |
          set -euo pipefail
          umask 077
          config="${GITHUB_WORKSPACE}/config/shared.json"
          linode_token="$(aws ssm get-parameter --name "$(jq -r '.aws.ssm_parameter_paths.linode_token' "${config}")" --with-decryption --query Parameter.Value --output text)"
          admin_password="$(aws ssm get-parameter --name "$(jq -r '.aws.ssm_parameter_paths.openvpn_admin_password' "${config}")" --with-decryption --query Parameter.Value --output text)"
          private_key_b64="$(aws ssm get-parameter --name "$(jq -r '.aws.ssm_parameter_paths.openvpn_ssh_private_key_b64' "${config}")" --with-decryption --query Parameter.Value --output text)"
          echo "::add-mask::${linode_token}"
          echo "::add-mask::${admin_password}"
          echo "::add-mask::${private_key_b64}"
          printf '%s' "${linode_token}" > "${WORK_DIR}/linode_token"
          printf '%s' "${admin_password}" > "${WORK_DIR}/admin_password"
          printf '%s' "${private_key_b64}" | base64 --decode > "${WORK_DIR}/id_ed25519"
          chmod 600 "${WORK_DIR}/linode_token" "${WORK_DIR}/admin_password" "${WORK_DIR}/id_ed25519"

      - name: "Open temporary runner access"
        env:
          RUNNER_CIDR: ${{ steps.runner_ip.outputs.runner_cidr }}
        run: |
          set -euo pipefail
          LINODE_TOKEN="$(cat "${WORK_DIR}/linode_token")" bash scripts/manage-runner-access.sh open \
            "${FIREWALL_ID}" "${INSTANCE_ID}" "${RUNNER_CIDR}" "${WORK_DIR}/firewall-baseline.json" "${ADMIN_PORT}"
          touch "${WORK_DIR}/firewall-opened.marker"

      - name: "Attest SSH host key"
        env:
          RUNNER_CIDR: ${{ steps.runner_ip.outputs.runner_cidr }}
        run: |
          set -euo pipefail
          config="${GITHUB_WORKSPACE}/config/shared.json"
          LINODE_TOKEN="$(cat "${WORK_DIR}/linode_token")" bash scripts/attest-host-key.sh \
            "${INSTANCE_ID}" "${FIREWALL_ID}" "${RESERVED_IP}" "${RUNNER_CIDR}" \
            "$(jq -r '.aws.ssm_parameter_paths.openvpn_ssh_host_key' "${config}")" \
            "${WORK_DIR}/known_hosts" "${WORK_DIR}/id_ed25519" "$(jq -r '.linode.automation_username' "${config}")" \
            "$(jq -r '.linode.instance_label' "${config}")" "${ADMIN_PORT}"

      - name: "Build Ansible inventory"
        run: |
          set -euo pipefail
          config="${GITHUB_WORKSPACE}/config/shared.json"
          printf '%s\n' 'all:' '  children:' '    openvpn_servers:' '      hosts:' "        ${RESERVED_IP}:" \
            "          ansible_user: $(jq -r '.linode.automation_username' "${config}")" \
            "          ansible_ssh_private_key_file: ${WORK_DIR}/id_ed25519" \
            "          ansible_ssh_common_args: '-o StrictHostKeyChecking=yes -o UserKnownHostsFile=${WORK_DIR}/known_hosts'" \
            > "${WORK_DIR}/inventory.yml"

      - name: "Run Ansible playbook"
        run: |
          set -euo pipefail
          OPENVPN_ADMIN_PASSWORD="$(cat "${WORK_DIR}/admin_password")" ANSIBLE_CONFIG="${GITHUB_WORKSPACE}/ansible/ansible.cfg" \
            ansible-playbook -i "${WORK_DIR}/inventory.yml" ansible/playbooks/configure-platform-access-base.yml

      - name: "Close runner access"
        if: always()
        env:
          RUNNER_CIDR: ${{ steps.runner_ip.outputs.runner_cidr }}
        run: |
          set -euo pipefail
          if [[ -f "${WORK_DIR}/firewall-opened.marker" ]]; then
            LINODE_TOKEN="$(cat "${WORK_DIR}/linode_token")" bash scripts/manage-runner-access.sh cleanup \
              "${FIREWALL_ID}" "${INSTANCE_ID}" "${RUNNER_CIDR}" "${WORK_DIR}/firewall-baseline.json"
          fi

      - name: "Remove working directory"
        if: always()
        run: rm -rf "${WORK_DIR}"
