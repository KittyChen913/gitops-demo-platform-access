name: "Platform Access reusable BASE configuration"

on:
  workflow_call:
    secrets:
      AWS_ACCOUNT_ID:
        required: true

permissions:
  contents: read

jobs:
  resolve-base:
    name: "Resolve BASE infrastructure"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TERRAFORM_ROOT: terraform/environments/shared/base
    outputs:
      instance_id: ${{ steps.outputs.outputs.instance_id }}
      firewall_id: ${{ steps.outputs.outputs.firewall_id }}
      reserved_ip: ${{ steps.outputs.outputs.reserved_ip }}
      admin_port: ${{ steps.outputs.outputs.admin_port }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.5

      - name: "Configure AWS credentials via OIDC"
        uses: ./.github/actions/configure-aws-credentials
        with:
          aws-account-id: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: "Terraform init"
        run: |
          set -euo pipefail
          backend="${RUNNER_TEMP}/backend.hcl"
          jq -r --arg region "${AWS_REGION}" '.terraform_backend | "bucket = \"\(.bucket)\"\nkey = \"\(.key)\"\nregion = \"\($region)\"\nencrypt = \"\(.encrypt)\"\nuse_lockfile = \"\(.use_lockfile)\""' config/shared.json > "${backend}"
          terraform -chdir="${TERRAFORM_ROOT}" init -input=false -lockfile=readonly -backend-config="${backend}"

      - name: "Read BASE outputs"
        id: outputs
        run: |
          set -euo pipefail
          {
            printf 'instance_id=%s\n' "$(terraform -chdir="${TERRAFORM_ROOT}" output -raw openvpn_instance_id)"
            printf 'firewall_id=%s\n' "$(terraform -chdir="${TERRAFORM_ROOT}" output -raw openvpn_firewall_id)"
            printf 'reserved_ip=%s\n' "$(terraform -chdir="${TERRAFORM_ROOT}" output -raw openvpn_reserved_ipv4)"
            printf 'admin_port=%s\n' "$(jq -r '.linode.admin_port' config/shared.json)"
          } >> "${GITHUB_OUTPUT}"

  configure-base:
    name: "Configure BASE"
    needs: resolve-base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Open BASE access"
        id: open
        uses: ./.github/actions/open-base-access
        with:
          instance-id: ${{ needs.resolve-base.outputs.instance_id }}
          firewall-id: ${{ needs.resolve-base.outputs.firewall_id }}
          reserved-ip: ${{ needs.resolve-base.outputs.reserved_ip }}
          admin-port: ${{ needs.resolve-base.outputs.admin_port }}
          aws-account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          fetch-automation-passwords: "true"

      - name: "Configure IPv4 forwarding"
        env:
          INVENTORY: ${{ steps.open.outputs.inventory-path }}
        run: |
          set -euo pipefail
          ANSIBLE_CONFIG="${GITHUB_WORKSPACE}/ansible/ansible.cfg" \
            ansible-playbook -i "${INVENTORY}" ansible/playbooks/configure-vpn-routing.yml

      - name: "Install dnsmasq package"
        env:
          INVENTORY: ${{ steps.open.outputs.inventory-path }}
        run: |
          set -euo pipefail
          ANSIBLE_CONFIG="${GITHUB_WORKSPACE}/ansible/ansible.cfg" \
            ansible-playbook -i "${INVENTORY}" ansible/playbooks/configure-dnsmasq.yml --tags install

      - name: "Apply dnsmasq configuration"
        env:
          INVENTORY: ${{ steps.open.outputs.inventory-path }}
        run: |
          set -euo pipefail
          ANSIBLE_CONFIG="${GITHUB_WORKSPACE}/ansible/ansible.cfg" \
            ansible-playbook -i "${INVENTORY}" ansible/playbooks/configure-dnsmasq.yml --tags configure

      - name: "Apply Access Server settings"
        env:
          INVENTORY: ${{ steps.open.outputs.inventory-path }}
        run: |
          set -euo pipefail
          ANSIBLE_CONFIG="${GITHUB_WORKSPACE}/ansible/ansible.cfg" \
            ansible-playbook -i "${INVENTORY}" ansible/playbooks/configure-openvpn-server.yml --tags server-settings

      - name: "Configure access groups"
        env:
          INVENTORY: ${{ steps.open.outputs.inventory-path }}
        run: |
          set -euo pipefail
          ANSIBLE_CONFIG="${GITHUB_WORKSPACE}/ansible/ansible.cfg" \
            ansible-playbook -i "${INVENTORY}" ansible/playbooks/configure-openvpn-server.yml --tags access-groups

      - name: "Configure automation VPN identities"
        env:
          INVENTORY: ${{ steps.open.outputs.inventory-path }}
          AUTOMATION_IDENTITY_PASSWORD_DIRECTORY: ${{ steps.open.outputs.automation-password-directory }}
        run: |
          set -euo pipefail
          ANSIBLE_CONFIG="${GITHUB_WORKSPACE}/ansible/ansible.cfg" \
            ansible-playbook -i "${INVENTORY}" ansible/playbooks/configure-automation-identities.yml

      - name: "Remove legacy firewall rules"
        env:
          INVENTORY: ${{ steps.open.outputs.inventory-path }}
        run: |
          set -euo pipefail
          ANSIBLE_CONFIG="${GITHUB_WORKSPACE}/ansible/ansible.cfg" \
            ansible-playbook -i "${INVENTORY}" ansible/playbooks/configure-host-firewall.yml --tags remove-legacy-rules

      - name: "Apply BASE firewall rules"
        env:
          INVENTORY: ${{ steps.open.outputs.inventory-path }}
        run: |
          set -euo pipefail
          ANSIBLE_CONFIG="${GITHUB_WORKSPACE}/ansible/ansible.cfg" \
            ansible-playbook -i "${INVENTORY}" ansible/playbooks/configure-host-firewall.yml --tags apply-firewall-rules

      - name: "Verify OpenVPN service"
        env:
          INVENTORY: ${{ steps.open.outputs.inventory-path }}
        run: |
          set -euo pipefail
          ANSIBLE_CONFIG="${GITHUB_WORKSPACE}/ansible/ansible.cfg" \
            ansible-playbook -i "${INVENTORY}" ansible/playbooks/verify-platform-access-base.yml --tags verify-openvpn

      - name: "Verify dnsmasq configuration"
        env:
          INVENTORY: ${{ steps.open.outputs.inventory-path }}
        run: |
          set -euo pipefail
          ANSIBLE_CONFIG="${GITHUB_WORKSPACE}/ansible/ansible.cfg" \
            ansible-playbook -i "${INVENTORY}" ansible/playbooks/verify-platform-access-base.yml --tags verify-dnsmasq

      - name: "Verify DNS exposure"
        env:
          INVENTORY: ${{ steps.open.outputs.inventory-path }}
        run: |
          set -euo pipefail
          ANSIBLE_CONFIG="${GITHUB_WORKSPACE}/ansible/ansible.cfg" \
            ansible-playbook -i "${INVENTORY}" ansible/playbooks/verify-platform-access-base.yml --tags verify-dns-exposure

      - name: "Verify automation VPN identities"
        env:
          INVENTORY: ${{ steps.open.outputs.inventory-path }}
          AUTOMATION_IDENTITY_PASSWORD_DIRECTORY: ${{ steps.open.outputs.automation-password-directory }}
        run: |
          set -euo pipefail
          ANSIBLE_CONFIG="${GITHUB_WORKSPACE}/ansible/ansible.cfg" \
            ansible-playbook -i "${INVENTORY}" ansible/playbooks/verify-platform-access-base.yml \
              --tags verify-automation-identities

      # verify-automation-identities 只查 sacli 屬性值，沒真的開過 tunnel。
      # 這裡挑 ci-cluster 代表三個身份跑一次端對端驗證；目標用
      # internal_dns_ip:admin_port，只驗證 tunnel 本身，不代表下游可達性。
      - name: "Resolve automation VPN test target"
        id: automation-vpn-test-target
        run: |
          set -euo pipefail
          config="${GITHUB_WORKSPACE}/config/shared.json"
          contract="${GITHUB_WORKSPACE}/config/automation-identities.json"
          test_identity="ci-cluster"
          dns_target="$(jq -r '.network.internal_dns_ip' "${config}"):$(jq -r '.linode.admin_port' "${config}")"
          {
            echo "identity=${test_identity}"
            echo "profile_parameter=$(jq -r --arg u "${test_identity}" '.identities[] | select(.username == $u) | .profile_ssm_path' "${contract}")"
            echo "password_parameter=$(jq -r --arg u "${test_identity}" '.identities[] | select(.username == $u) | .password_ssm_path' "${contract}")"
            echo "expected_tunnel_ip=$(jq -r --arg u "${test_identity}" '.identities[] | select(.username == $u) | .conn_ip' "${contract}")"
            echo "target=${dns_target}"
          } >> "${GITHUB_OUTPUT}"

      - name: "Open automation VPN tunnel [ci-cluster]"
        id: automation-vpn-verify
        uses: ./.github/actions/open-automation-vpn-tunnel
        with:
          identity: ${{ steps.automation-vpn-test-target.outputs.identity }}
          profile-ssm-parameter: ${{ steps.automation-vpn-test-target.outputs.profile_parameter }}
          password-ssm-parameter: ${{ steps.automation-vpn-test-target.outputs.password_parameter }}
          expected-tunnel-ip: ${{ steps.automation-vpn-test-target.outputs.expected_tunnel_ip }}
          route-targets: ${{ steps.automation-vpn-test-target.outputs.target }}
          health-targets: ${{ steps.automation-vpn-test-target.outputs.target }}

      - name: "Close automation VPN tunnel [ci-cluster]"
        if: always()
        uses: ./.github/actions/close-automation-vpn-tunnel
        with:
          state-directory: ${{ steps.automation-vpn-verify.outputs['state-directory'] }}

      - name: "Close BASE access"
        if: always()
        uses: ./.github/actions/close-base-access
        with:
          firewall-id: ${{ needs.resolve-base.outputs.firewall_id }}
          instance-id: ${{ needs.resolve-base.outputs.instance_id }}
          work-dir: ${{ steps.open.outputs.work-dir }}
          runner-cidr: ${{ steps.open.outputs.runner-cidr }}
