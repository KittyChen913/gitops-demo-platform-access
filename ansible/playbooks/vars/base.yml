---
platform_config: >-
  {{ lookup('ansible.builtin.file',
  playbook_dir ~ '/../../config/shared.json') | from_json }}
access_contract: >-
  {{ lookup('ansible.builtin.file',
  playbook_dir ~ '/../../config/access-groups.json') | from_json }}
automation_identity_contract: >-
  {{ lookup('ansible.builtin.file',
  playbook_dir ~ '/../../config/automation-identities.json') | from_json }}
openvpn_admin_password: >-
  {{ lookup('ansible.builtin.env', 'OPENVPN_ADMIN_PASSWORD') }}
openvpn_tunnel_cidr: "{{ platform_config.network.vpn_client_cidr }}"
openvpn_group_default_cidr: >-
  {{ platform_config.network.vpn_group_default_cidr }}
openvpn_automation_cidr: "{{ platform_config.network.automation_identity_cidr }}"
openvpn_client_cidrs:
  - "{{ openvpn_tunnel_cidr }}"
  - "{{ openvpn_group_default_cidr }}"
  - "{{ openvpn_automation_cidr }}"
openvpn_server_tunnel_ip: "{{ platform_config.network.internal_dns_ip }}"
internal_dns_server_ip: "{{ platform_config.network.internal_dns_ip }}"
internal_domain: "{{ platform_config.network.internal_domain }}"
upstream_dns_servers: "{{ platform_config.network.upstream_dns_servers }}"
dnsmasq_base_config_path: /etc/dnsmasq.d/platform-access-base.conf
# ss -p 的 process 欄位必須精確辨識 dnsmasq；若 metadata 缺失，必要 listener 的
# assertion 會 fail closed，不得只依位址推定 owner。
dns_listener_process_metadata_pattern: 'users:\(\('
dnsmasq_listener_process_pattern: 'users:\(\("dnsmasq",pid='
# Runtime baseline 已確認 group client 可 ping tunnel DNS，但 DNS query 會 timeout；
# 因此以明確的 client-facing per-port ACL 補齊 DNS traffic contract。Access Server
# 會把 client UDP/53 DNAT 至本機 DNS proxy UDP/953；TCP/53 則直接送達 dnsmasq。
openvpn_human_dns_access_rules:
  access_to.0: "+NAT:{{ internal_dns_server_ip }}:udp/53"
  access_to.1: "+NAT:{{ internal_dns_server_ip }}:tcp/53"
# Host firewall 位於 DNAT 之後，必須使用實際抵達 INPUT hook 的 destination port；
# 不得把 client-facing access_to port 直接複製成 host firewall port。
openvpn_dns_proxy_udp_port: "953"
openvpn_tunnel_dns_firewall_rules:
  - protocol: udp
    port: "{{ openvpn_dns_proxy_udp_port }}"
  - protocol: tcp
    port: "53"
openvpn_human_access_to_keys:
  - access_to.0
  - access_to.1
  - access_to.2
  - access_to.3
openvpn_admin_port: "{{ platform_config.linode.admin_port }}"
openvpn_port: "{{ platform_config.linode.openvpn_port }}"
openvpn_protocol: "{{ platform_config.linode.openvpn_protocol }}"
openvpn_admin_username: >-
  {{ platform_config.linode.openvpn_admin_username }}
openvpn_access_groups: "{{ access_contract.groups }}"
openvpn_automation_group: "{{ automation_identity_contract.group }}"
openvpn_automation_identities: "{{ automation_identity_contract.identities }}"
