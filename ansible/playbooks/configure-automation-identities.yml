---
- name: Configure automation VPN identities
  hosts: openvpn_servers
  become: true
  gather_facts: false

  vars_files:
    - vars/base.yml

  pre_tasks:
    - ansible.builtin.import_tasks: tasks/base-pretasks.yml
      tags: always

    - name: Validate automation identity password hand-off
      ansible.builtin.assert:
        that:
          - automation_identity_contract.schema_version == 2
          - openvpn_automation_group == 'ci-automation'
          - openvpn_automation_identities | length == 3
          - lookup('ansible.builtin.env', 'AUTOMATION_IDENTITY_PASSWORD_DIRECTORY') | length > 0
        fail_msg: Automation identity contract or password hand-off is invalid.
      no_log: true
      tags: always

    - name: Validate automation identity egress boundaries
      ansible.builtin.assert:
        that:
          - item.public_egress is boolean
        fail_msg: Automation identity public_egress must be a boolean.
      loop: "{{ openvpn_automation_identities }}"
      loop_control:
        label: "{{ item.username }}"
      tags: always

    - name: Initialize automation identity password map
      ansible.builtin.set_fact:
        automation_identity_passwords: {}
      no_log: true
      tags: always

    - name: Load automation identity passwords
      ansible.builtin.set_fact:
        automation_identity_passwords: >-
          {{ automation_identity_passwords |
             combine({
               item.username: lookup(
                 'ansible.builtin.file',
                 lookup(
                   'ansible.builtin.env',
                   'AUTOMATION_IDENTITY_PASSWORD_DIRECTORY'
                 ) ~ '/' ~ item.username
               )
             }) }}
      loop: "{{ openvpn_automation_identities }}"
      loop_control:
        label: "{{ item.username }}"
      no_log: true
      tags: always

  roles:
    - automation_identities
