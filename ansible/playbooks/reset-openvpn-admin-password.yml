---
- name: Reset the OpenVPN administrator password
  hosts: openvpn_servers
  become: true
  gather_facts: false

  vars_files:
    - vars/base.yml

  pre_tasks:
    - ansible.builtin.import_tasks: tasks/base-pretasks.yml
      tags: always
    - ansible.builtin.import_tasks: tasks/assert-admin-password-contract.yml
      tags: always

  roles:
    - role: openvpn_access_server
      tasks_from: reset_password.yml
