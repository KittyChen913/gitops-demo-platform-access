---
- name: Verify Access Server status
  ansible.builtin.command:
    argv: [/usr/local/openvpn_as/scripts/sacli, status]
  changed_when: false
  tags: verify-openvpn

- name: Read BASE Access Server configuration for verification
  ansible.builtin.command:
    argv: [/usr/local/openvpn_as/scripts/sacli, ConfigQuery]
  register: base_verify_config_query
  changed_when: false
  no_log: true
  tags: verify-openvpn

- name: Verify the BASE split-DNS domain is active
  ansible.builtin.assert:
    that:
      - >-
        (base_verify_config_query.stdout | from_json).get(
        'vpn.server.dhcp_option.domain', '') == internal_domain
    fail_msg: The BASE split-DNS domain is not active.
  tags: verify-openvpn

- name: Verify dnsmasq configuration
  ansible.builtin.command:
    argv: [dnsmasq, --test]
  changed_when: false
  tags: verify-dnsmasq

- name: Read active listeners
  ansible.builtin.command:
    argv: [ss, -lntup]
  register: listeners
  changed_when: false
  tags: verify-dns-exposure

- name: Refuse public or wildcard DNS listener
  ansible.builtin.assert:
    that:
      - >-
        listeners.stdout is not
        regex('(?m)(0\\.0\\.0\\.0|\\[::\\]|\\*):53\\b')
      - >-
        listeners.stdout is
        regex('(?m)^udp\\s+.*' ~
              (internal_dns_server_ip | regex_escape) ~ ':53\\b')
      - >-
        listeners.stdout is
        regex('(?m)^tcp\\s+.*' ~
              (internal_dns_server_ip | regex_escape) ~ ':53\\b')
    fail_msg: The tunnel DNS listener bind or exposure contract is invalid.
  tags: verify-dns-exposure

- name: Read BASE group properties for DNS verification
  ansible.builtin.command:
    argv:
      - /usr/local/openvpn_as/scripts/sacli
      - --pfilt
      - "{{ item }}"
      - UserPropGet
  loop: "{{ openvpn_access_groups }}"
  register: base_verify_group_queries
  changed_when: false
  no_log: true
  tags: verify-openvpn

- name: Build BASE group DNS verification map
  ansible.builtin.set_fact:
    base_verify_group_properties: >-
      {{ base_verify_group_properties | default({}) |
         combine({item.item: ((item.stdout | from_json).get(item.item, {}))}) }}
  loop: "{{ base_verify_group_queries.results }}"
  loop_control:
    label: "{{ item.item }}"
  no_log: true
  tags: verify-openvpn

- name: Verify every human group holds a contiguous access rule list
  ansible.builtin.assert:
    that:
      - >-
        (base_verify_group_properties[item] | dict2items
         | selectattr('key', 'match', '^access_to\.')
         | map(attribute='key') | list
         | difference(openvpn_human_access_to_keys)) | length == 0
      - >-
        (base_verify_group_properties[item] | dict2items
         | selectattr('key', 'match', '^access_to\.')
         | map(attribute='key') | sort | list) ==
        openvpn_human_access_to_keys[0:
          (base_verify_group_properties[item] | dict2items
           | selectattr('key', 'match', '^access_to\.') | list | length)]
      - >-
        (base_verify_group_properties[item] | dict2items
         | selectattr('key', 'match', '^access_to\.')
         | rejectattr('key', 'in', openvpn_human_dns_access_rules.keys() | list)
         | map(attribute='value')
         | reject('match', '^\+NAT:([0-9]{1,3}\.){3}[0-9]{1,3}:tcp/443$')
         | list | length) == 0
    fail_msg: A human group access rule list is sparse or invalid.
  loop: "{{ openvpn_access_groups }}"
  loop_control:
    label: "{{ item }}"
  tags: verify-openvpn

- name: Verify every BASE group holds the tunnel DNS rules
  ansible.builtin.assert:
    that:
      - >-
        (base_verify_group_properties[item.0].get(item.1.key, '') | string) ==
        (item.1.value | string)
    fail_msg: A BASE group is missing a tunnel DNS access rule.
  loop: >-
    {{ openvpn_access_groups |
       product(openvpn_human_dns_access_rules | dict2items) | list }}
  loop_control:
    label: "{{ item.0 }}:{{ item.1.key }}"
  tags: verify-openvpn

- name: Read active tunnel DNS firewall rules
  ansible.builtin.command:
    argv: [iptables, -S, ufw-user-input]
  register: base_verify_dns_firewall_rules
  changed_when: false
  tags: verify-dns-exposure

- name: Verify every VPN address pool can enter the tunnel DNS firewall rules
  ansible.builtin.assert:
    that:
      - >-
        base_verify_dns_firewall_rules.stdout_lines
        | select('search', '(^| )-s ' ~ (item.0 | regex_escape) ~ '($| )')
        | select('search', '(^| )-d ' ~
                 ((internal_dns_server_ip ~ '/32') | regex_escape) ~ '($| )')
        | select('search', '(^| )-i ' ~
                 (openvpn_tunnel_interface | regex_escape) ~ '($| )')
        | select('search', '(^| )-p ' ~ (item.1 | regex_escape) ~ '($| )')
        | select('search', '(^| )--dport 53($| )')
        | select('search', '(^| )-j ACCEPT($| )')
        | list | length == 1
    fail_msg: A tunnel DNS firewall rule is missing or duplicated.
  loop: "{{ openvpn_client_cidrs | product(['udp', 'tcp']) | list }}"
  loop_control:
    label: "{{ item.0 }}:{{ item.1 }}"
  tags: verify-dns-exposure

- name: Read IPv4 forwarding state
  ansible.builtin.command:
    argv: [sysctl, -n, net.ipv4.ip_forward]
  register: ipv4_forwarding_state
  changed_when: false
  tags: verify-vpn-routing

- name: Verify IPv4 forwarding is active
  ansible.builtin.assert:
    that:
      - ipv4_forwarding_state.stdout | trim == '1'
    fail_msg: IPv4 forwarding is not active.
  tags: verify-vpn-routing

- name: Verify automation egress forwarding rule is active
  ansible.builtin.command:
    argv:
      - iptables
      - -C
      - ufw-user-forward
      - -o
      - "{{ openvpn_public_interface }}"
      - -s
      - "{{ openvpn_automation_cidr }}"
      - -j
      - ACCEPT
  changed_when: false
  tags: verify-vpn-routing

- name: Verify automation egress NAT rule is active
  ansible.builtin.command:
    argv:
      - iptables
      - -t
      - nat
      - -C
      - POSTROUTING
      - -s
      - "{{ openvpn_automation_cidr }}"
      - -o
      - "{{ openvpn_public_interface }}"
      - -j
      - MASQUERADE
  changed_when: false
  tags: verify-vpn-routing
