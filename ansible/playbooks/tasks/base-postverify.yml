---
- name: Verify Access Server status
  ansible.builtin.command:
    argv: [/usr/local/openvpn_as/scripts/sacli, status]
  changed_when: false
  tags: verify-openvpn

- name: Read BASE Access Server configuration for verification
  ansible.builtin.command:
    argv: [/usr/local/openvpn_as/scripts/sacli, ConfigQuery]
  register: base_verify_config_query
  changed_when: false
  no_log: true
  tags: verify-openvpn

- name: Verify the BASE split-DNS domain is active
  ansible.builtin.assert:
    that:
      - >-
        (base_verify_config_query.stdout | from_json).get(
        'vpn.server.dhcp_option.domain', '') == internal_domain
    fail_msg: The BASE split-DNS domain is not active.
  tags: verify-openvpn

- name: Verify dnsmasq configuration
  ansible.builtin.command:
    argv: [dnsmasq, --test]
  changed_when: false
  tags: verify-dnsmasq

- name: Read active listeners
  ansible.builtin.command:
    argv: [ss, -lntup]
  register: listeners
  changed_when: false
  tags: verify-dns-exposure

- name: Refuse public or wildcard DNS listener
  ansible.builtin.assert:
    that:
      - >-
        listeners.stdout is not
        regex('(?m)(0\\.0\\.0\\.0|\\[::\\]|\\*):53\\b')
    fail_msg: DNS is listening on a public or wildcard address.
  tags: verify-dns-exposure

- name: Read IPv4 forwarding state
  ansible.builtin.command:
    argv: [sysctl, -n, net.ipv4.ip_forward]
  register: ipv4_forwarding_state
  changed_when: false
  tags: verify-vpn-routing

- name: Verify IPv4 forwarding is active
  ansible.builtin.assert:
    that:
      - ipv4_forwarding_state.stdout | trim == '1'
    fail_msg: IPv4 forwarding is not active.
  tags: verify-vpn-routing

- name: Verify automation egress forwarding rule is active
  ansible.builtin.command:
    argv:
      - iptables
      - -C
      - ufw-user-forward
      - -o
      - "{{ openvpn_public_interface }}"
      - -s
      - "{{ openvpn_automation_cidr }}"
      - -j
      - ACCEPT
  changed_when: false
  tags: verify-vpn-routing

- name: Verify automation egress NAT rule is active
  ansible.builtin.command:
    argv:
      - iptables
      - -t
      - nat
      - -C
      - POSTROUTING
      - -s
      - "{{ openvpn_automation_cidr }}"
      - -o
      - "{{ openvpn_public_interface }}"
      - -j
      - MASQUERADE
  changed_when: false
  tags: verify-vpn-routing
