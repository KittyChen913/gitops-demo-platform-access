---
- name: Verify Access Server status
  ansible.builtin.command:
    argv: [/usr/local/openvpn_as/scripts/sacli, status]
  changed_when: false
  tags: verify-openvpn

- name: Read BASE Access Server configuration for verification
  ansible.builtin.command:
    argv: [/usr/local/openvpn_as/scripts/sacli, ConfigQuery]
  register: base_verify_config_query
  changed_when: false
  no_log: true
  tags: verify-openvpn

- name: Verify the BASE split-DNS domain is active
  ansible.builtin.assert:
    that:
      - >-
        (base_verify_config_query.stdout | from_json).get(
        'vpn.server.dhcp_option.domain', '') == internal_domain
    fail_msg: The BASE split-DNS domain is not active.
  tags: verify-openvpn

# 使用 Ubuntu package 與 systemd ExecStartPre 相同的入口，讓 validation 讀取主機
# /etc/default/dnsmasq 的實際 CONFIG_DIR 與 DNSMASQ_OPTS。
- name: Verify dnsmasq configuration
  ansible.builtin.command:
    argv:
      - /usr/share/dnsmasq/systemd-helper
      - checkconfig
  changed_when: false
  tags: verify-dnsmasq

- name: Read the managed BASE dnsmasq exposure configuration
  ansible.builtin.slurp:
    src: "{{ dnsmasq_base_config_path }}"
  register: base_verify_dnsmasq_config
  tags: verify-dns-exposure

# dnsmasq 的 config parser 會先 strip 行首空白、把所有 whitespace 正規化成空白，
# 並允許 "=" 前後帶空白，因此 "  interface = as0t0" 這種寫法一樣會生效。regex 必須
# 一起容忍這些變體，否則 drift 檢查會漏掉真正被套用的 directive。
# 這裡用 [^\S\n] 而不是 [ \t]：後者的 \t 經過 Jinja 字串處理後不會可靠地比對到 tab。
- name: Refuse a pinned or publicly exposed BASE DNS binding
  ansible.builtin.assert:
    that:
      - >-
        (base_verify_dnsmasq_config.content | b64decode) is not
        regex('(?mi)^[^\\S\\n]*interface[^\\S\\n]*=')
      - >-
        (base_verify_dnsmasq_config.content | b64decode) is
        regex('(?m)^[^\\S\\n]*except-interface[^\\S\\n]*=[^\\S\\n]*' ~
              (openvpn_public_interface | regex_escape) ~ '[^\\S\\n]*$')
      - >-
        (base_verify_dnsmasq_config.content | b64decode) is
        regex('(?m)^[^\\S\\n]*listen-address[^\\S\\n]*=[^\\S\\n]*' ~
              (internal_dns_server_ip | regex_escape) ~ '[^\\S\\n]*$')
      - >-
        (base_verify_dnsmasq_config.content | b64decode) is
        regex('(?m)^[^\\S\\n]*listen-address[^\\S\\n]*=[^\\S\\n]*' ~
              '127\\.0\\.0\\.1[^\\S\\n]*$')
    fail_msg: The BASE DNS binding is pinned or publicly exposed.
  tags: verify-dns-exposure

- name: Read active listeners
  ansible.builtin.command:
    argv: [ss, -H, -lntup]
  register: listeners
  changed_when: false
  tags: verify-dns-exposure

# interface= 會讓 dnsmasq 一併監聽 lo 的 ::1 與 tunnel interface 的 IPv6 link-local。
# 全域拒絕 wildcard，但 IPv6 與精確位址集合只限制 dnsmasq，避免誤擋 systemd-resolved
# 合法的 loopback listener。必要 listener 同時要求精確 process metadata；若 ss -p 無法
# 提供 owner，assertion 會 fail closed。
- name: Refuse public, wildcard, or IPv6 DNS listener
  ansible.builtin.assert:
    that:
      - >-
        listeners.stdout is not
        regex('(?m)(0\\.0\\.0\\.0|\\[::\\]|\\*):53\\b')
      - >-
        (listeners.stdout_lines
         | select('search', ':53\\b')
         | reject('search', dns_listener_process_metadata_pattern)
         | list | length) == 0
      - >-
        (listeners.stdout_lines
         | select('search', dnsmasq_listener_process_pattern)
         | select('search', ':53\\b')
         | select('search', '\\[[0-9a-fA-F:]+\\]\\S*:53\\b')
         | list | length) == 0
      - >-
        (listeners.stdout_lines
         | select('search', ':53\\b')
         | select('search', dnsmasq_listener_process_pattern)
         | reject('search', '(^|\\s)127\\.0\\.0\\.1:53(\\s|$)')
         | reject('search', '(^|\\s)' ~
                  (internal_dns_server_ip | regex_escape) ~ ':53(\\s|$)')
         | list | length) == 0
      - >-
        (listeners.stdout_lines
         | select('match', '^udp\\s+')
         | select('search', '(^|\\s)' ~
                  (internal_dns_server_ip | regex_escape) ~ ':53(\\s|$)')
         | select('search', dnsmasq_listener_process_pattern)
         | list | length) == 1
      - >-
        (listeners.stdout_lines
         | select('match', '^tcp\\s+')
         | select('search', '(^|\\s)' ~
                  (internal_dns_server_ip | regex_escape) ~ ':53(\\s|$)')
         | select('search', dnsmasq_listener_process_pattern)
         | list | length) == 1
      - >-
        (listeners.stdout_lines
         | select('match', '^udp\\s+')
         | select('search', '(^|\\s)127\\.0\\.0\\.1:53(\\s|$)')
         | select('search', dnsmasq_listener_process_pattern)
         | list | length) == 1
      - >-
        (listeners.stdout_lines
         | select('match', '^tcp\\s+')
         | select('search', '(^|\\s)127\\.0\\.0\\.1:53(\\s|$)')
         | select('search', dnsmasq_listener_process_pattern)
         | list | length) == 1
    fail_msg: The tunnel DNS listener bind or exposure contract is invalid.
  tags: verify-dns-exposure

# DNS proxy listener 與 dnsmasq listener 適用相同契約：必須具備精確 process
# metadata；若 ss -p 無法提供 owner，assertion 會 fail closed，不得只依位址推定。
- name: Verify the Access Server UDP DNS proxy listener
  ansible.builtin.assert:
    that:
      - >-
        (listeners.stdout_lines
         | select('match', '^udp\\s+')
         | select('search', '(^|\\s)' ~
                  (internal_dns_server_ip | regex_escape) ~ ':' ~
                  (openvpn_dns_proxy_udp_port | regex_escape) ~ '(\\s|$)')
         | select('search', dns_listener_process_metadata_pattern)
         | list | length) == 1
    fail_msg: The Access Server UDP DNS proxy listener is not active.
  tags: verify-dns-exposure

# Access Server 的 DNS proxy process 名稱可能隨版本改變，因此不硬綁 python3。
# systemd cgroup 才是穩定的 service ownership boundary；listener PID 必須屬於
# openvpnas.service，不能只確認任意 process 佔用 UDP/953。
- name: Record the Access Server UDP DNS proxy listener PID
  ansible.builtin.set_fact:
    base_verify_dns_proxy_listener_pids: >-
      {{ listeners.stdout_lines
         | select('match', '^udp\\s+')
         | select('search', '(^|\\s)' ~
                  (internal_dns_server_ip | regex_escape) ~ ':' ~
                  (openvpn_dns_proxy_udp_port | regex_escape) ~ '(\\s|$)')
         | map('regex_findall', 'pid=([0-9]+)')
         | flatten | unique | list }}
  tags: verify-dns-exposure

- name: Verify the Access Server UDP DNS proxy listener has one owner
  ansible.builtin.assert:
    that:
      - base_verify_dns_proxy_listener_pids | length == 1
    fail_msg: The Access Server UDP DNS proxy listener owner is ambiguous.
  tags: verify-dns-exposure

- name: Read the Access Server systemd control group
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - --property=ControlGroup
      - --value
      - openvpnas
  register: base_verify_openvpnas_control_group
  changed_when: false
  tags: verify-dns-exposure

- name: Read the Access Server UDP DNS proxy listener cgroup
  ansible.builtin.slurp:
    src: "/proc/{{ base_verify_dns_proxy_listener_pids[0] }}/cgroup"
  register: base_verify_dns_proxy_listener_cgroup
  tags: verify-dns-exposure

- name: Verify the UDP DNS proxy listener belongs to Access Server
  ansible.builtin.assert:
    that:
      - (base_verify_openvpnas_control_group.stdout | trim | length) > 0
      - >-
        (base_verify_dns_proxy_listener_cgroup.content | b64decode) is
        regex('(?m)(^|:)' ~
              (base_verify_openvpnas_control_group.stdout |
               trim | regex_escape) ~
              '(/[^\\s:]*)?$')
    fail_msg: The UDP DNS proxy listener is not owned by Access Server.
  tags: verify-dns-exposure

# Host firewall 只允許 post-DNAT 的 UDP/953，因此整組 tunnel DNS contract 相依於
# Access Server native nftables 仍把 client 的 UDP/53 重導至 DNS proxy port。這項
# 相依必須一併驗證：DNAT 一旦消失，listener 與 firewall rule assertion 仍會通過，
# 但 client 的 UDP/53 會落到 INPUT 預設 DROP，等同重現本次修正的失敗模式。
- name: Read the Access Server DNS proxy NAT contract
  ansible.builtin.command:
    argv: [nft, list, table, ip, as_nat]
  register: base_verify_dns_proxy_nat
  changed_when: false
  failed_when: false
  tags: verify-dns-exposure

- name: Verify client DNS is redirected to the Access Server DNS proxy port
  ansible.builtin.assert:
    that:
      - base_verify_dns_proxy_nat.rc == 0
      - >-
        (base_verify_dns_proxy_nat.stdout_lines
         | select('search', '(^|\\s)ip\\s+daddr\\s+' ~
                  (internal_dns_server_ip | regex_escape) ~ '(\\s|$)')
         | select('search', '(^|\\s)udp(\\s|$)')
         | select('search', '(^|\\s)dport\\s+(53|domain)(\\s|$)')
         | select('search', '(^|\\s)dnat\\s+to\\s+' ~
                  (internal_dns_server_ip | regex_escape) ~ ':' ~
                  (openvpn_dns_proxy_udp_port | regex_escape) ~ '(\\s|$)')
         | list | length) >= 1
    fail_msg: >-
      The Access Server DNS proxy DNAT no longer matches the host firewall
      post-DNAT port contract.
  tags: verify-dns-exposure

- name: Read BASE group properties for DNS verification
  ansible.builtin.command:
    argv:
      - /usr/local/openvpn_as/scripts/sacli
      - --pfilt
      - "{{ item }}"
      - UserPropGet
  loop: "{{ openvpn_access_groups }}"
  register: base_verify_group_queries
  changed_when: false
  no_log: true
  tags: verify-openvpn

- name: Build BASE group DNS verification map
  ansible.builtin.set_fact:
    base_verify_group_properties: >-
      {{ base_verify_group_properties | default({}) |
         combine({item.item: ((item.stdout | from_json).get(item.item, {}))}) }}
  loop: "{{ base_verify_group_queries.results }}"
  loop_control:
    label: "{{ item.item }}"
  no_log: true
  tags: verify-openvpn

- name: Verify every human group holds a contiguous access rule list
  ansible.builtin.assert:
    that:
      - >-
        (base_verify_group_properties[item] | dict2items
         | selectattr('key', 'match', '^access_to\.')
         | map(attribute='key') | list
         | difference(openvpn_human_access_to_keys)) | length == 0
      - >-
        (base_verify_group_properties[item] | dict2items
         | selectattr('key', 'match', '^access_to\.')
         | map(attribute='key') | sort | list) ==
        openvpn_human_access_to_keys[0:
          (base_verify_group_properties[item] | dict2items
           | selectattr('key', 'match', '^access_to\.') | list | length)]
      - >-
        (base_verify_group_properties[item] | dict2items
         | selectattr('key', 'match', '^access_to\.')
         | rejectattr('key', 'in', openvpn_human_dns_access_rules.keys() | list)
         | map(attribute='value')
         | reject('match', '^\+NAT:([0-9]{1,3}\.){3}[0-9]{1,3}:tcp/443$')
         | list | length) == 0
    fail_msg: A human group access rule list is sparse or invalid.
  loop: "{{ openvpn_access_groups }}"
  loop_control:
    label: "{{ item }}"
  tags: verify-openvpn

- name: Verify every BASE group holds the tunnel DNS rules
  ansible.builtin.assert:
    that:
      - >-
        (base_verify_group_properties[item.0].get(item.1.key, '') | string) ==
        (item.1.value | string)
    fail_msg: A BASE group is missing a tunnel DNS access rule.
  loop: >-
    {{ openvpn_access_groups |
       product(openvpn_human_dns_access_rules | dict2items) | list }}
  loop_control:
    label: "{{ item.0 }}:{{ item.1.key }}"
  tags: verify-openvpn

- name: Verify the tunnel DNS firewall interface pattern
  ansible.builtin.assert:
    that:
      - openvpn_tunnel_interface is match('^as0t[0-9]+$')
      - openvpn_tunnel_interface_pattern == 'as0t+'
      - openvpn_tunnel_interface_pattern != openvpn_public_interface
    fail_msg: The tunnel DNS firewall interface pattern is invalid.
  tags: verify-dns-exposure

- name: Read active tunnel DNS firewall rules
  ansible.builtin.command:
    argv: [iptables, -S, ufw-user-input]
  register: base_verify_dns_firewall_rules
  changed_when: false
  tags: verify-dns-exposure

# 只允許 as0t+ wildcard 與 post-DNAT destination port 的規則存在。negative assert
# 比對 as0t[0-9]+ 而非當下探測到的單一介面名，才能同時抓出過去 apply 留下的
# 其他 as0tN 殘留規則。
- name: Verify every VPN address pool can enter the tunnel DNS firewall rules
  ansible.builtin.assert:
    that:
      - >-
        base_verify_dns_firewall_rules.stdout_lines
        | select('search', '(^| )-s ' ~ (item.0 | regex_escape) ~ '($| )')
        | select('search', '(^| )-d ' ~
                 ((internal_dns_server_ip ~ '/32') | regex_escape) ~ '($| )')
        | select('search', '(^| )-i ' ~
                 (openvpn_tunnel_interface_pattern | regex_escape) ~ '($| )')
        | select('search', '(^| )-p ' ~
                 (item.1.protocol | regex_escape) ~ '($| )')
        | select('search', '(^| )--dport ' ~
                 (item.1.port | regex_escape) ~ '($| )')
        | select('search', '(^| )-j ACCEPT($| )')
        | list | length == 1
      - >-
        base_verify_dns_firewall_rules.stdout_lines
        | select('search', '(^| )-s ' ~ (item.0 | regex_escape) ~ '($| )')
        | select('search', '(^| )-d ' ~
                 ((internal_dns_server_ip ~ '/32') | regex_escape) ~ '($| )')
        | select('search', '(^| )-i as0t[0-9]+($| )')
        | select('search', '(^| )-p ' ~
                 (item.1.protocol | regex_escape) ~ '($| )')
        | select('search', '(^| )--dport ' ~
                 (item.1.port | regex_escape) ~ '($| )')
        | select('search', '(^| )-j ACCEPT($| )')
        | list | length == 0
    fail_msg: A tunnel DNS firewall rule is missing, duplicated, or legacy.
  loop: >-
    {{ openvpn_client_cidrs |
       product(openvpn_tunnel_dns_firewall_rules) | list }}
  loop_control:
    label: "{{ item.0 }}:{{ item.1.protocol }}/{{ item.1.port }}"
  tags: verify-dns-exposure

- name: Refuse obsolete pre-DNAT UDP DNS firewall rules
  ansible.builtin.assert:
    that:
      - >-
        base_verify_dns_firewall_rules.stdout_lines
        | select('search', '(^| )-s ' ~ (item | regex_escape) ~ '($| )')
        | select('search', '(^| )-d ' ~
                 ((internal_dns_server_ip ~ '/32') | regex_escape) ~ '($| )')
        | select('search', '(^| )-i as0t([0-9]+|\\+)($| )')
        | select('search', '(^| )-p udp($| )')
        | select('search', '(^| )--dport 53($| )')
        | select('search', '(^| )-j ACCEPT($| )')
        | list | length == 0
    fail_msg: An obsolete pre-DNAT UDP DNS firewall rule is still active.
  loop: "{{ openvpn_client_cidrs }}"
  loop_control:
    label: "{{ item }}:udp/53"
  tags: verify-dns-exposure

- name: Read IPv4 forwarding state
  ansible.builtin.command:
    argv: [sysctl, -n, net.ipv4.ip_forward]
  register: ipv4_forwarding_state
  changed_when: false
  tags: verify-vpn-routing

- name: Verify IPv4 forwarding is active
  ansible.builtin.assert:
    that:
      - ipv4_forwarding_state.stdout | trim == '1'
    fail_msg: IPv4 forwarding is not active.
  tags: verify-vpn-routing

- name: Verify automation egress forwarding rule is active
  ansible.builtin.command:
    argv:
      - iptables
      - -C
      - ufw-user-forward
      - -o
      - "{{ openvpn_public_interface }}"
      - -s
      - "{{ openvpn_automation_cidr }}"
      - -j
      - ACCEPT
  changed_when: false
  tags: verify-vpn-routing

- name: Verify automation egress NAT rule is active
  ansible.builtin.command:
    argv:
      - iptables
      - -t
      - nat
      - -C
      - POSTROUTING
      - -s
      - "{{ openvpn_automation_cidr }}"
      - -o
      - "{{ openvpn_public_interface }}"
      - -j
      - MASQUERADE
  changed_when: false
  tags: verify-vpn-routing
