---
- name: Configure Shared OpenVPN/DNS BASE
  hosts: openvpn_servers
  become: true
  gather_facts: false

  vars_files:
    - vars/base.yml

  pre_tasks:
    - ansible.builtin.import_tasks: tasks/base-pretasks.yml
      tags: always
    - ansible.builtin.import_tasks: tasks/assert-admin-password-contract.yml
      tags: always

  roles:
    - dnsmasq
    - openvpn_access_server
    - host_firewall
    # Access Server 與 UFW 都可能重建 netfilter rules；NAT 必須最後套用。
    - vpn_routing

  post_tasks:
    - ansible.builtin.meta: flush_handlers
    - ansible.builtin.import_tasks: tasks/base-postverify.yml
