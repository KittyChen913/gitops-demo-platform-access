---
- name: Verify OpenVPN/DNS BASE configuration
  hosts: openvpn_servers
  become: true
  gather_facts: false

  vars_files:
    - vars/base.yml

  pre_tasks:
    - ansible.builtin.import_tasks: tasks/base-pretasks.yml
      tags: always

  tasks:
    - ansible.builtin.import_tasks: tasks/base-postverify.yml

    - name: Initialize automation identity password map
      ansible.builtin.set_fact:
        automation_identity_passwords: {}
      no_log: true
      tags: verify-automation-identities

    - name: Load automation identity passwords
      ansible.builtin.set_fact:
        automation_identity_passwords: >-
          {{ automation_identity_passwords |
             combine({
               item.username: lookup(
                 'ansible.builtin.file',
                 lookup(
                   'ansible.builtin.env',
                   'AUTOMATION_IDENTITY_PASSWORD_DIRECTORY'
                 ) ~ '/' ~ item.username
               )
             }) }}
      loop: "{{ openvpn_automation_identities }}"
      loop_control:
        label: "{{ item.username }}"
      no_log: true
      tags: verify-automation-identities

    - name: Verify automation VPN identities
      ansible.builtin.include_role:
        name: automation_identities
        tasks_from: verify
      tags: verify-automation-identities
