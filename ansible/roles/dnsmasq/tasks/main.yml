---
- name: Install dnsmasq and DNS diagnostics
  ansible.builtin.apt:
    name: [dnsmasq, dnsutils]
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: install

- name: Atomically manage BASE dnsmasq configuration
  ansible.builtin.template:
    src: platform-access-base.conf.j2
    dest: /etc/dnsmasq.d/platform-access-base.conf
    owner: root
    group: root
    mode: "0644"
    validate: "dnsmasq --test --conf-file=%s"
  notify:
    - Validate dnsmasq configuration
    - Restart dnsmasq
  tags: configure

- name: Enable dnsmasq
  ansible.builtin.systemd_service:
    name: dnsmasq
    enabled: true
    state: started
  tags: configure
