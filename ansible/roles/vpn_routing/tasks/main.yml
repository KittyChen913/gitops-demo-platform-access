---
- name: Apply pending network and firewall handlers before NAT
  ansible.builtin.meta: flush_handlers

- name: Enable IPv4 forwarding idempotently
  ansible.builtin.template:
    src: 99-openvpn-forwarding.conf.j2
    dest: /etc/sysctl.d/99-openvpn-forwarding.conf
    owner: root
    group: root
    mode: "0644"
  notify: Apply IPv4 forwarding

- name: Install automation egress NAT service
  ansible.builtin.template:
    src: openvpn-automation-egress.service.j2
    dest: /etc/systemd/system/openvpn-automation-egress.service
    owner: root
    group: root
    mode: "0644"
  register: automation_egress_service

- name: Reconcile automation egress NAT
  ansible.builtin.systemd_service:
    name: openvpn-automation-egress.service
    enabled: true
    state: restarted
    daemon_reload: "{{ automation_egress_service.changed }}"
