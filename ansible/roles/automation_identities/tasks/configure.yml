---
- name: Read automation group properties
  ansible.builtin.command:
    argv:
      - /usr/local/openvpn_as/scripts/sacli
      - --pfilt
      - "{{ openvpn_automation_group }}"
      - UserPropGet
  register: automation_group_query
  changed_when: false
  no_log: true

- name: Record automation group properties
  ansible.builtin.set_fact:
    automation_group_properties: >-
      {{ (automation_group_query.stdout | from_json)
         .get(openvpn_automation_group, {}) }}
  no_log: true

- name: Enforce the automation group contract
  ansible.builtin.command:
    argv:
      - /usr/local/openvpn_as/scripts/sacli
      - --user
      - "{{ openvpn_automation_group }}"
      - --key
      - "{{ item.key }}"
      - --value
      - "{{ item.value }}"
      - UserPropPut
  loop:
    - {key: group_declare, value: "true"}
    - {key: type, value: group}
    - {key: prop_superuser, value: "false"}
    - {key: prop_autologin, value: "false"}
  loop_control:
    label: "{{ item.key }}"
  when: >-
    (automation_group_properties.get(item.key, '') | string | lower) !=
    (item.value | string | lower)
  notify: Apply Access Server changes

# Public egress 必須由 identity contract 個別授權；不可在 ci-automation group
# 放寬，否則只需存取 Server 本機 TCP/943 的身份也會取得 Internet access。
- name: Remove broad public egress access from the automation group
  ansible.builtin.command:
    argv:
      - /usr/local/openvpn_as/scripts/sacli
      - --user
      - "{{ openvpn_automation_group }}"
      - --key
      - "{{ item }}"
      - UserPropDel
  loop:
    - access_to.1
    - access_to.0
  when: automation_group_properties.get(item, '') | length > 0
  notify: Apply Access Server changes

# ci-automation 使用 config/shared.json 中獨立的 static group subnet；BASE
# Terraform contract 會先確認它不與一般 client dynamic pool 或 group default
# pool 重疊。固定 conn_ip 讓 host firewall 與 VPN egress NAT 只放行自動化身份，
# 不把一般 VPN User 納入 public egress。Linode VPC、LKE Pod／Service CIDR 與
# client-side network 等 runtime 範圍仍須在部署前確認不重疊。
- name: Enforce the automation group static IP subnet
  ansible.builtin.command:
    argv:
      - /usr/local/openvpn_as/scripts/sacli
      - --user
      - "{{ openvpn_automation_group }}"
      - --key
      - group_subnets.0
      - --value
      - "{{ openvpn_automation_cidr }}"
      - UserPropPut
  when: >-
    (automation_group_properties.get('group_subnets.0', '') | string) !=
    (openvpn_automation_cidr | string)
  notify: Apply Access Server changes

- name: Read automation identity properties
  ansible.builtin.command:
    argv:
      - /usr/local/openvpn_as/scripts/sacli
      - --pfilt
      - "{{ item.username }}"
      - UserPropGet
  loop: "{{ openvpn_automation_identities }}"
  loop_control:
    label: "{{ item.username }}"
  register: automation_identity_queries
  changed_when: false
  no_log: true

- name: Build automation identity property map
  ansible.builtin.set_fact:
    automation_identity_properties: >-
      {{ automation_identity_properties | default({}) |
         combine({
           item.item.username:
           ((item.stdout | from_json).get(item.item.username, {}))
         }) }}
  loop: "{{ automation_identity_queries.results }}"
  loop_control:
    label: "{{ item.item.username }}"
  no_log: true

- name: Enforce automation identity properties
  ansible.builtin.command:
    argv:
      - /usr/local/openvpn_as/scripts/sacli
      - --user
      - "{{ item.0.username }}"
      - --key
      - "{{ item.1.key }}"
      - --value
      - "{{ item.1.value }}"
      - UserPropPut
  loop: >-
    {{ openvpn_automation_identities |
       product([
         {'key': 'user_auth_type', 'value': 'local'},
         {'key': 'conn_group', 'value': openvpn_automation_group},
         {'key': 'prop_superuser', 'value': 'false'},
         {'key': 'prop_autologin', 'value': 'false'}
       ]) | list }}
  loop_control:
    label: "{{ item.0.username }}:{{ item.1.key }}"
  when: >-
    (automation_identity_properties[item.0.username]
     .get(item.1.key, '') | string | lower) !=
    (item.1.value | string | lower)
  no_log: true
  notify: Apply Access Server changes

- name: Enforce automation identity network profile types
  ansible.builtin.command:
    argv:
      - /usr/local/openvpn_as/scripts/sacli
      - --user
      - "{{ item.username }}"
      - --key
      - type
      - --value
      - "{{ item.public_egress | ternary('user_compile', 'user_connect') }}"
      - UserPropPut
  loop: "{{ openvpn_automation_identities }}"
  loop_control:
    label: "{{ item.username }}"
  when: >-
    (automation_identity_properties[item.username].get('type', '') | string) !=
    (item.public_egress | ternary('user_compile', 'user_connect'))
  no_log: true
  notify: Apply Access Server changes

- name: Enforce public egress access for authorized automation identities
  ansible.builtin.command:
    argv:
      - /usr/local/openvpn_as/scripts/sacli
      - --user
      - "{{ item.0.username }}"
      - --key
      - "{{ item.1.key }}"
      - --value
      - "{{ item.1.value }}"
      - UserPropPut
  loop: >-
    {{ openvpn_automation_identities |
       product([
         {'key': 'access_to.0', 'value': '+NAT:0.0.0.0/1'},
         {'key': 'access_to.1', 'value': '+NAT:128.0.0.0/1'}
       ]) | list }}
  loop_control:
    label: "{{ item.0.username }}:{{ item.1.key }}"
  when:
    - item.0.public_egress | bool
    - >-
      (automation_identity_properties[item.0.username]
       .get(item.1.key, '') | string) != (item.1.value | string)
  no_log: true
  notify: Apply Access Server changes

- name: Remove public egress access from local-only automation identities
  ansible.builtin.command:
    argv:
      - /usr/local/openvpn_as/scripts/sacli
      - --user
      - "{{ item.0.username }}"
      - --key
      - "{{ item.1 }}"
      - UserPropDel
  loop: >-
    {{ openvpn_automation_identities |
       product(['access_to.1', 'access_to.0']) | list }}
  loop_control:
    label: "{{ item.0.username }}:{{ item.1 }}"
  when:
    - not (item.0.public_egress | bool)
    - >-
      automation_identity_properties[item.0.username]
      .get(item.1, '') | length > 0
  no_log: true
  notify: Apply Access Server changes

# 每個自動化身份指派固定 conn_ip（來自 config/automation-identities.json 的
# conn_ip 欄位，落在上面設定的 openvpn_automation_cidr 之內）。有了固定 IP，
# host_firewall／vpn_routing 才能用專屬 subnet 而不是一般 client pools
# 來限制 forward／MASQUERADE 範圍，避免一般 VPN User 的連線也被納入
# public egress NAT 的放行範圍。
- name: Enforce automation identity static IP addresses
  ansible.builtin.command:
    argv:
      - /usr/local/openvpn_as/scripts/sacli
      - --user
      - "{{ item.username }}"
      - --key
      - conn_ip
      - --value
      - "{{ item.conn_ip }}"
      - UserPropPut
  loop: "{{ openvpn_automation_identities }}"
  loop_control:
    label: "{{ item.username }}"
  when: >-
    (automation_identity_properties[item.username]
     .get('conn_ip', '') | string) != (item.conn_ip | string)
  no_log: true
  notify: Apply Access Server changes

- name: Set automation identity passwords
  ansible.builtin.command:
    argv:
      - /usr/local/openvpn_as/scripts/sacli
      - --user
      - "{{ item.username }}"
      - --new_pass
      - "{{ automation_identity_passwords[item.username] }}"
      - SetLocalPassword
  loop: "{{ openvpn_automation_identities }}"
  loop_control:
    label: "{{ item.username }}"
  changed_when: true
  no_log: true
  notify: Apply Access Server changes

- name: Apply automation identity changes before profile generation
  ansible.builtin.meta: flush_handlers

# Marketplace StackScript 未釘選 Access Server minor 版本，因此使用各版本皆支援的
# GetUserlogin 介面，不預先加入 2.9+ 才支援的 prefer-tls-crypt-v2 旗標。
- name: Generate user-locked automation profiles
  ansible.builtin.command:
    argv:
      - /usr/local/openvpn_as/scripts/sacli
      - --user
      - "{{ item.username }}"
      - GetUserlogin
  loop: "{{ openvpn_automation_identities }}"
  loop_control:
    label: "{{ item.username }}"
  register: automation_identity_profiles
  changed_when: false
  no_log: true

- name: Validate automation profile size
  ansible.builtin.assert:
    that:
      - item.stdout | length > 0
      - item.stdout | length <= 8192
    fail_msg: Automation VPN profile exceeds the SSM Advanced parameter limit.
  loop: "{{ automation_identity_profiles.results }}"
  loop_control:
    label: "{{ item.item.username }}"
  no_log: true

- name: Publish automation profiles to SSM
  ansible.builtin.command:
    argv:
      - aws
      - ssm
      - put-parameter
      - --name
      - "{{ item.item.profile_ssm_path }}"
      - --type
      - String
      - --tier
      - Advanced
      - --overwrite
      - --value
      - "{{ item.stdout }}"
      - --output
      - text
      - --query
      - Version
  loop: "{{ automation_identity_profiles.results }}"
  loop_control:
    label: "{{ item.item.username }}"
  delegate_to: localhost
  become: false
  changed_when: true
  no_log: true
