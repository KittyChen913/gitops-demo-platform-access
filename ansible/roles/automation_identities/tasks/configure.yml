---
- name: Read automation group properties
  ansible.builtin.command:
    argv:
      - /usr/local/openvpn_as/scripts/sacli
      - --pfilt
      - "{{ openvpn_automation_group }}"
      - UserPropGet
  register: automation_group_query
  changed_when: false
  no_log: true

- name: Record automation group properties
  ansible.builtin.set_fact:
    automation_group_properties: >-
      {{ (automation_group_query.stdout | from_json)
         .get(openvpn_automation_group, {}) }}
  no_log: true

- name: Enforce the automation group contract
  ansible.builtin.command:
    argv:
      - /usr/local/openvpn_as/scripts/sacli
      - --user
      - "{{ openvpn_automation_group }}"
      - --key
      - "{{ item.key }}"
      - --value
      - "{{ item.value }}"
      - UserPropPut
  loop:
    - {key: group_declare, value: "true"}
    - {key: type, value: group}
    - {key: prop_superuser, value: "false"}
    - {key: prop_autologin, value: "false"}
  loop_control:
    label: "{{ item.key }}"
  when: >-
    (automation_group_properties.get(item.key, '') | string | lower) !=
    (item.value | string | lower)
  notify: Apply Access Server changes

# ci-automation 用專屬的 group subnet（見 config/shared.json 的
# network.automation_identity_cidr），跟 dev-ops/prod-ops/platform-ops 等一般
# VPN User共用的 vpn_client_cidr 動態 pool分開。沒有這個 group subnet，底下的
# conn_ip 靜態指派不會生效，AS 只會從全域動態 pool 分配位址（見官方文件
# tutorial--user-and-group-properties-cli.html「Groups need a subnet to work
# with」）。這個 subnet 只有 3 個自動化身份會用到，host_firewall／
# vpn_routing 的 MASQUERADE／forward 規則改成只放行這個 CIDR，藉此把三個
# 自動化身份跟一般人員 VPN User 的存取範圍分開，縮小 5.x
# 節提到的「整個 tunnel CIDR to any」風險。
# 注意：172.27.240.0/28 是否跟 Linode VPC／LKE Pod／Service CIDR 等其他網段
# 衝突，本機無法驗證，需要在實際部署（terraform apply + ansible 實跑）時
# 確認一次；若衝突，只需要改 config/shared.json 的
# network.automation_identity_cidr 為其他未使用的 /28（或更大）區段即可。
- name: Enforce the automation group static IP subnet
  ansible.builtin.command:
    argv:
      - /usr/local/openvpn_as/scripts/sacli
      - --user
      - "{{ openvpn_automation_group }}"
      - --key
      - group_subnets.0
      - --value
      - "{{ openvpn_automation_cidr }}"
      - UserPropPut
  when: >-
    (automation_group_properties.get('group_subnets.0', '') | string) !=
    (openvpn_automation_cidr | string)
  notify: Apply Access Server changes

- name: Read automation identity properties
  ansible.builtin.command:
    argv:
      - /usr/local/openvpn_as/scripts/sacli
      - --pfilt
      - "{{ item.username }}"
      - UserPropGet
  loop: "{{ openvpn_automation_identities }}"
  loop_control:
    label: "{{ item.username }}"
  register: automation_identity_queries
  changed_when: false
  no_log: true

- name: Build automation identity property map
  ansible.builtin.set_fact:
    automation_identity_properties: >-
      {{ automation_identity_properties | default({}) |
         combine({
           item.item.username:
           ((item.stdout | from_json).get(item.item.username, {}))
         }) }}
  loop: "{{ automation_identity_queries.results }}"
  loop_control:
    label: "{{ item.item.username }}"
  no_log: true

- name: Enforce automation identity properties
  ansible.builtin.command:
    argv:
      - /usr/local/openvpn_as/scripts/sacli
      - --user
      - "{{ item.0.username }}"
      - --key
      - "{{ item.1.key }}"
      - --value
      - "{{ item.1.value }}"
      - UserPropPut
  loop: >-
    {{ openvpn_automation_identities |
       product([
         {'key': 'type', 'value': 'user_connect'},
         {'key': 'user_auth_type', 'value': 'local'},
         {'key': 'conn_group', 'value': openvpn_automation_group},
         {'key': 'prop_superuser', 'value': 'false'},
         {'key': 'prop_autologin', 'value': 'false'}
       ]) | list }}
  loop_control:
    label: "{{ item.0.username }}:{{ item.1.key }}"
  when: >-
    (automation_identity_properties[item.0.username]
     .get(item.1.key, '') | string | lower) !=
    (item.1.value | string | lower)
  no_log: true
  notify: Apply Access Server changes

# 每個自動化身份指派固定 conn_ip（來自 config/automation-identities.json 的
# conn_ip 欄位，落在上面設定的 openvpn_automation_cidr 之內）。有了固定 IP，
# host_firewall／vpn_routing 才能用「這個 /28」而不是整個 openvpn_tunnel_cidr
# 來限制 forward／MASQUERADE 範圍，避免一般 VPN User 的連線也被納入
# public egress NAT 的放行範圍。
- name: Enforce automation identity static IP addresses
  ansible.builtin.command:
    argv:
      - /usr/local/openvpn_as/scripts/sacli
      - --user
      - "{{ item.username }}"
      - --key
      - conn_ip
      - --value
      - "{{ item.conn_ip }}"
      - UserPropPut
  loop: "{{ openvpn_automation_identities }}"
  loop_control:
    label: "{{ item.username }}"
  when: >-
    (automation_identity_properties[item.username]
     .get('conn_ip', '') | string) != (item.conn_ip | string)
  no_log: true
  notify: Apply Access Server changes

- name: Set automation identity passwords
  ansible.builtin.command:
    argv:
      - /usr/local/openvpn_as/scripts/sacli
      - --user
      - "{{ item.username }}"
      - --new_pass
      - "{{ automation_identity_passwords[item.username] }}"
      - SetLocalPassword
  loop: "{{ openvpn_automation_identities }}"
  loop_control:
    label: "{{ item.username }}"
  changed_when: true
  no_log: true
  notify: Apply Access Server changes

- name: Apply automation identity changes before profile generation
  ansible.builtin.meta: flush_handlers

# Marketplace StackScript 未釘選 Access Server minor 版本，因此使用各版本皆支援的
# GetUserlogin 介面，不預先加入 2.9+ 才支援的 prefer-tls-crypt-v2 旗標。
- name: Generate user-locked automation profiles
  ansible.builtin.command:
    argv:
      - /usr/local/openvpn_as/scripts/sacli
      - --user
      - "{{ item.username }}"
      - GetUserlogin
  loop: "{{ openvpn_automation_identities }}"
  loop_control:
    label: "{{ item.username }}"
  register: automation_identity_profiles
  changed_when: false
  no_log: true

- name: Validate automation profile size
  ansible.builtin.assert:
    that:
      - item.stdout | length > 0
      - item.stdout | length <= 8192
    fail_msg: Automation VPN profile exceeds the SSM Advanced parameter limit.
  loop: "{{ automation_identity_profiles.results }}"
  loop_control:
    label: "{{ item.item.username }}"
  no_log: true

- name: Publish automation profiles to SSM
  ansible.builtin.command:
    argv:
      - aws
      - ssm
      - put-parameter
      - --name
      - "{{ item.item.profile_ssm_path }}"
      - --type
      - String
      - --tier
      - Advanced
      - --overwrite
      - --value
      - "{{ item.stdout }}"
      - --output
      - text
      - --query
      - Version
  loop: "{{ automation_identity_profiles.results }}"
  loop_control:
    label: "{{ item.item.username }}"
  delegate_to: localhost
  become: false
  changed_when: true
  no_log: true
