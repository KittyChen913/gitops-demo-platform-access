---
- name: Read Access Server configuration
  ansible.builtin.command:
    argv: [/usr/local/openvpn_as/scripts/sacli, ConfigQuery]
  register: openvpn_config_query
  changed_when: false
  no_log: true
  tags: server-settings

- name: Parse Access Server configuration
  ansible.builtin.set_fact:
    openvpn_config: "{{ openvpn_config_query.stdout | from_json }}"
  no_log: true
  tags: server-settings

# dhcp_option.domain 推送 internal domain 作為 client 的 search domain。
# 少了它，Windows 會平行對多個介面的 resolver 送出查詢，公網 resolver 先回
# NXDOMAIN 時可能勝出，內部 hostname 因此間歇性解析失敗（split-DNS 外洩）。
- name: Define BASE-only split-tunnel settings
  ansible.builtin.set_fact:
    openvpn_base_settings:
      vpn.daemon.0.client.network: "{{ openvpn_tunnel_cidr.split('/')[0] }}"
      vpn.daemon.0.client.netmask_bits: "{{ openvpn_tunnel_cidr.split('/')[1] }}"
      vpn.server.group_pool.0: "{{ openvpn_group_default_cidr }}"
      vpn.client.routing.reroute_gw: "false"
      vpn.client.routing.reroute_dns: custom
      vpn.server.dhcp_option.dns.0: "{{ internal_dns_server_ip }}"
      vpn.server.dhcp_option.domain: "{{ internal_domain }}"
      # Access Server 3.2.1+ 的 DNS proxy 預設使用 Linux host resolver；這會讓
      # internal-only record 被送往 public DNS 並回傳 NXDOMAIN。Proxy upstream
      # 必須指回本機 dnsmasq，才能同時解析 internal record 與既有 public upstream。
      dnsproxy.upstream_dns: "{{ internal_dns_server_ip }}"
      vpn.server.routing.gateway_access: "true"
      vpn.server.routing.private_access: nat
  tags: server-settings

- name: Apply changed BASE Access Server settings
  ansible.builtin.command:
    argv:
      - /usr/local/openvpn_as/scripts/sacli
      - --key
      - "{{ item.key }}"
      - --value
      - "{{ item.value }}"
      - ConfigPut
  loop: "{{ openvpn_base_settings | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: (openvpn_config.get(item.key, '') | string) != (item.value | string)
  notify: Apply Access Server changes
  tags: server-settings

- name: Read BASE group properties
  ansible.builtin.command:
    argv:
      - /usr/local/openvpn_as/scripts/sacli
      - --pfilt
      - "{{ item }}"
      - UserPropGet
  loop: "{{ openvpn_access_groups }}"
  register: openvpn_group_queries
  changed_when: false
  no_log: true
  tags: access-groups

- name: Build BASE group property map
  ansible.builtin.set_fact:
    openvpn_group_properties: >-
      {{ openvpn_group_properties | default({}) |
         combine({item.item: ((item.stdout | from_json).get(item.item, {}))}) }}
  loop: "{{ openvpn_group_queries.results }}"
  loop_control:
    label: "{{ item.item }}"
  no_log: true
  tags: access-groups

- name: Declare approved BASE groups
  ansible.builtin.command:
    argv:
      - /usr/local/openvpn_as/scripts/sacli
      - --user
      - "{{ item }}"
      - --key
      - group_declare
      - --value
      - "true"
      - UserPropPut
  loop: "{{ openvpn_access_groups }}"
  when: >-
    openvpn_group_properties[item].get('group_declare', 'false') |
    string | lower != 'true'
  notify: Apply Access Server changes
  tags: access-groups

- name: Ensure approved identities are Access Server groups
  ansible.builtin.command:
    argv:
      - /usr/local/openvpn_as/scripts/sacli
      - --user
      - "{{ item }}"
      - --key
      - type
      - --value
      - group
      - UserPropPut
  loop: "{{ openvpn_access_groups }}"
  when: openvpn_group_properties[item].get('type', '') != 'group'
  notify: Apply Access Server changes
  tags: access-groups

- name: Force BASE groups to ordinary non-admin role
  ansible.builtin.command:
    argv:
      - /usr/local/openvpn_as/scripts/sacli
      - --user
      - "{{ item }}"
      - --key
      - prop_superuser
      - --value
      - "false"
      - UserPropPut
  loop: "{{ openvpn_access_groups }}"
  when: >-
    openvpn_group_properties[item].get('prop_superuser', '') |
    string | lower != 'false'
  notify: Apply Access Server changes
  tags: access-groups

- name: Disable auto-login for every BASE group
  ansible.builtin.command:
    argv:
      - /usr/local/openvpn_as/scripts/sacli
      - --user
      - "{{ item }}"
      - --key
      - prop_autologin
      - --value
      - "false"
      - UserPropPut
  loop: "{{ openvpn_access_groups }}"
  when: >-
    openvpn_group_properties[item].get('prop_autologin', '') |
    string | lower != 'false'
  notify: Apply Access Server changes
  tags: access-groups

# group default pool 與 tunnel DNS 不在同一個 CIDR；runtime 已證明 gateway 可達，
# 但 DNS query 仍會 timeout，因此不能只依賴 dhcp_option.dns.0 與 gateway_access。
# DNS rule 屬於所有人員 group 共用且不依賴 endpoint 的 BASE contract，因此不交
# 給環境 SYNC 管理。
- name: Refuse an invalid existing human group access rule structure
  ansible.builtin.assert:
    that:
      - >-
        (openvpn_group_properties[item] | dict2items
         | selectattr('key', 'match', '^access_to\.')
         | map(attribute='key') | list
         | difference(openvpn_human_access_to_keys)) | length == 0
      - >-
        (openvpn_group_properties[item] | dict2items
         | selectattr('key', 'match', '^access_to\.')
         | map(attribute='key') | sort | list) ==
        openvpn_human_access_to_keys[0:
          (openvpn_group_properties[item] | dict2items
           | selectattr('key', 'match', '^access_to\.') | list | length)]
      - >-
        (openvpn_group_properties[item] | dict2items
         | selectattr('key', 'match', '^access_to\.')
         | rejectattr('key', 'in', openvpn_human_dns_access_rules.keys() | list)
         | map(attribute='value')
         | reject('match', '^\+NAT:([0-9]{1,3}\.){3}[0-9]{1,3}:tcp/443$')
         | list | length) == 0
    fail_msg: The existing human group access rule structure is invalid.
  loop: "{{ openvpn_access_groups }}"
  loop_control:
    label: "{{ item }}"
  tags: access-groups

- name: Refuse to overwrite unrelated BASE tunnel DNS access rules
  ansible.builtin.assert:
    that:
      - >-
        (openvpn_group_properties[item.0].get(item.1.key, '') | string) in
        ['', item.1.value | string]
    fail_msg: The reserved BASE tunnel DNS index holds an unrelated rule.
  loop: >-
    {{ openvpn_access_groups |
       product(openvpn_human_dns_access_rules | dict2items) | list }}
  loop_control:
    label: "{{ item.0 }}:{{ item.1.key }}"
  tags: access-groups

- name: Allow every BASE group to query tunnel DNS
  ansible.builtin.command:
    argv:
      - /usr/local/openvpn_as/scripts/sacli
      - --user
      - "{{ item.0 }}"
      - --key
      - "{{ item.1.key }}"
      - --value
      - "{{ item.1.value }}"
      - UserPropPut
  loop: >-
    {{ openvpn_access_groups |
       product(openvpn_human_dns_access_rules | dict2items) | list }}
  loop_control:
    label: "{{ item.0 }}:{{ item.1.key }}"
  when: >-
    (openvpn_group_properties[item.0].get(item.1.key, '') | string) !=
    (item.1.value | string)
  notify: Apply Access Server changes
  tags: access-groups

- name: Read OpenVPN administrator properties
  ansible.builtin.command:
    argv:
      - /usr/local/openvpn_as/scripts/sacli
      - --pfilt
      - "{{ openvpn_admin_username }}"
      - UserPropGet
  register: openvpn_admin_query
  changed_when: false
  no_log: true
  tags: admin-identity

- name: Parse OpenVPN administrator properties
  ansible.builtin.set_fact:
    openvpn_admin_properties: >-
      {{ (openvpn_admin_query.stdout | from_json)
         .get(openvpn_admin_username, {}) }}
    openvpn_admin_required_properties:
      type: user_connect
      user_auth_type: local
      prop_superuser: "true"
      prop_deny: "false"
      prop_deny_web: "false"
  no_log: true
  tags: admin-identity

- name: Enforce the local OpenVPN administrator contract
  ansible.builtin.command:
    argv:
      - /usr/local/openvpn_as/scripts/sacli
      - --user
      - "{{ openvpn_admin_username }}"
      - --key
      - "{{ item.key }}"
      - --value
      - "{{ item.value }}"
      - UserPropPut
  loop: "{{ openvpn_admin_required_properties | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: >-
    (openvpn_admin_properties.get(item.key, '') | string | lower) !=
    (item.value | string | lower)
  no_log: true
  notify: Apply Access Server changes
  tags: admin-identity

- name: Apply administrator identity changes before authentication
  ansible.builtin.meta: flush_handlers
  tags: admin-identity

# access-groups 由獨立 playbook invocation 套用；先執行已通知的 handler，避免
# 後面的 recovery start 與 play 結束時的 handler 重複執行。
- name: Apply access group changes before recovery check
  ansible.builtin.meta: flush_handlers
  tags: access-groups

# 上次執行若在 UserPropPut 後、handler 前中斷，stored property 會已符合 desired
# value，重跑時不會再次通知 handler。access-groups 無 handler 執行結果時補一次
# sacli start；server-settings 的無變更重跑不需要這個 recovery 行為。
- name: Reapply stored BASE properties after an interrupted run
  ansible.builtin.command:
    argv: [/usr/local/openvpn_as/scripts/sacli, start]
  when: openvpn_access_server_apply_result is not defined
  changed_when: false
  no_log: true
  tags: access-groups
