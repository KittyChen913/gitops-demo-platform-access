---
- name: Set the OpenVPN administrator password without logging it
  ansible.builtin.command:
    argv:
      - /usr/local/openvpn_as/scripts/sacli
      - --user
      - "{{ openvpn_admin_username }}"
      - --new_pass
      - "{{ openvpn_admin_password }}"
      - SetLocalPassword
  changed_when: true
  no_log: true
  notify: Apply Access Server changes
  tags: set-password

- name: Apply administrator password changes before verification
  ansible.builtin.meta: flush_handlers
  tags: set-password

- name: Verify the OpenVPN Admin Web UI credentials
  ansible.builtin.uri:
    url: >-
      https://127.0.0.1:{{ openvpn_admin_port
      }}/api/auth/login/userpassword
    method: POST
    headers:
      Accept: application/json
    body_format: json
    body:
      request_admin: true
      username: "{{ openvpn_admin_username }}"
      password: "{{ openvpn_admin_password }}"
    return_content: true
    status_code: 200
    timeout: 30
    use_proxy: false
    validate_certs: false
  register: openvpn_admin_web_login
  changed_when: false
  failed_when: >-
    openvpn_admin_web_login.status != 200 or
    ((openvpn_admin_web_login.json | default({}))
    .get('auth_token', '') | length) == 0 or
    (((openvpn_admin_web_login.json | default({}))
    .get('user_properties', {})).get('user_type', '')) != 'admin'
  no_log: true
  tags: verify-login

- name: Verify the OpenVPN Client Web UI credentials
  ansible.builtin.uri:
    url: >-
      https://127.0.0.1:{{ openvpn_admin_port
      }}/api/auth/login/userpassword
    method: POST
    headers:
      Accept: application/json
    body_format: json
    body:
      request_admin: false
      username: "{{ openvpn_admin_username }}"
      password: "{{ openvpn_admin_password }}"
    return_content: true
    status_code: 200
    timeout: 30
    use_proxy: false
    validate_certs: false
  register: openvpn_client_web_login
  changed_when: false
  failed_when: >-
    openvpn_client_web_login.status != 200 or
    ((openvpn_client_web_login.json | default({}))
    .get('auth_token', '') | length) == 0
  no_log: true
  tags: verify-login
