---
- name: Detect Marketplace host firewall backend
  ansible.builtin.command:
    argv: [ufw, status]
  register: ufw_status
  changed_when: false
  failed_when: false
  tags: always

- name: Fail closed instead of installing a second firewall backend
  ansible.builtin.assert:
    that:
      - ufw_status.rc == 0
      - "'Status: active' in ufw_status.stdout"
    fail_msg: >-
      The Marketplace host must already use active UFW; no fallback firewall
      is installed.
  tags: always

- name: Remove Marketplace public web exceptions not owned by BASE
  ansible.builtin.command:
    argv: [ufw, --force, delete, allow, "{{ item }}/tcp"]
  loop: ["80", "443", "945"]
  register: ufw_remove_public_web
  changed_when: ufw_remove_public_web.rc == 0
  failed_when: false
  notify: Reload UFW
  tags: remove-legacy-rules

- name: Allow SSH only behind the temporary Linode Firewall runner lease
  ansible.builtin.command:
    argv: [ufw, allow, 22/tcp]
  register: ufw_ssh
  changed_when: "'Skipping adding existing rule' not in ufw_ssh.stdout"
  notify: Reload UFW
  tags: apply-firewall-rules

- name: Allow Admin UI only behind the temporary Linode Firewall runner lease
  ansible.builtin.command:
    argv: [ufw, allow, "{{ openvpn_admin_port }}/tcp"]
  register: ufw_admin
  changed_when: "'Skipping adding existing rule' not in ufw_admin.stdout"
  notify: Reload UFW
  tags: apply-firewall-rules

- name: Allow the public OpenVPN listener
  ansible.builtin.command:
    argv: [ufw, allow, "{{ openvpn_port }}/{{ openvpn_protocol }}"]
  register: ufw_openvpn
  changed_when: "'Skipping adding existing rule' not in ufw_openvpn.stdout"
  notify: Reload UFW
  tags: apply-firewall-rules

- name: Allow every VPN address pool to query tunnel DNS
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - in
      - "on"
      - "{{ openvpn_tunnel_interface }}"
      - from
      - "{{ item.0 }}"
      - to
      - "{{ internal_dns_server_ip }}"
      - port
      - "53"
      - proto
      - "{{ item.1 }}"
  loop: "{{ openvpn_client_cidrs | product(['udp', 'tcp']) | list }}"
  loop_control:
    label: "{{ item.0 }}:{{ item.1 }}"
  register: ufw_dns_allow
  changed_when: "'Skipping adding existing rule' not in ufw_dns_allow.stdout"
  notify: Reload UFW
  tags: apply-firewall-rules

- name: Allow every VPN address pool to reach the Access Server client API
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - in
      - "on"
      - "{{ openvpn_tunnel_interface }}"
      - from
      - "{{ item }}"
      - to
      - "{{ internal_dns_server_ip }}"
      - port
      - "{{ openvpn_admin_port }}"
      - proto
      - tcp
  loop: "{{ openvpn_client_cidrs }}"
  loop_control:
    label: "{{ item }}"
  register: ufw_vpn_client_api_allow
  changed_when: >-
    'Skipping adding existing rule' not in ufw_vpn_client_api_allow.stdout
  notify: Reload UFW
  tags: apply-firewall-rules

- name: Resolve automation identity routes
  ansible.builtin.command:
    argv:
      - ip
      - -j
      - -4
      - route
      - get
      - "{{ item.conn_ip }}"
  loop: "{{ openvpn_automation_identities }}"
  loop_control:
    label: "{{ item.username }}"
  register: automation_identity_routes
  changed_when: false
  tags: apply-firewall-rules

- name: Record automation identity route details
  ansible.builtin.set_fact:
    automation_identity_route_details: >-
      {{ automation_identity_routes.results |
         map(attribute='stdout') | map('from_json') | flatten }}
  tags: apply-firewall-rules

- name: Record automation tunnel interfaces
  ansible.builtin.set_fact:
    openvpn_automation_tunnel_interfaces: >-
      {{ automation_identity_route_details |
         map(attribute='dev') | unique | list }}
  tags: apply-firewall-rules

- name: Refuse automation routes outside Access Server tunnel interfaces
  ansible.builtin.assert:
    that:
      - openvpn_automation_tunnel_interfaces | length > 0
      - openvpn_public_interface not in openvpn_automation_tunnel_interfaces
      - "'lo' not in openvpn_automation_tunnel_interfaces"
    fail_msg: >-
      Automation identity routes do not use an Access Server tunnel interface.
  tags: apply-firewall-rules

- name: Allow only automation identities to forward through the public interface
  ansible.builtin.command:
    argv:
      - ufw
      - route
      - allow
      - in
      - "on"
      - "{{ item }}"
      - out
      - "on"
      - "{{ openvpn_public_interface }}"
      - from
      - "{{ openvpn_automation_cidr }}"
      - to
      - any
  loop: "{{ openvpn_automation_tunnel_interfaces }}"
  loop_control:
    label: "{{ item }}"
  register: ufw_automation_egress
  changed_when: "'Skipping adding existing rule' not in ufw_automation_egress.stdout"
  notify: Reload UFW
  tags: apply-firewall-rules

- name: Remove any generic public DNS allow rule
  ansible.builtin.command:
    argv: [ufw, --force, delete, allow, "53/{{ item }}"]
  loop: [udp, tcp]
  register: ufw_dns_public_allow_removal
  changed_when: ufw_dns_public_allow_removal.rc == 0
  failed_when: false
  notify: Reload UFW
  tags: remove-legacy-rules

- name: Explicitly deny DNS on the public interface
  ansible.builtin.command:
    argv:
      - ufw
      - deny
      - in
      - "on"
      - "{{ openvpn_public_interface }}"
      - to
      - any
      - port
      - "53"
      - proto
      - "{{ item }}"
  loop: [udp, tcp]
  register: ufw_dns_deny
  changed_when: "'Skipping adding existing rule' not in ufw_dns_deny.stdout"
  notify: Reload UFW
  tags: apply-firewall-rules
